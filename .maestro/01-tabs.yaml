appId: ${APP_ID}
name: Log in and visit every tab
# Live runs (scripts/e2e.sh --live) only check the screens: the content is
# the real account's.
tags:
  - live
---
- runFlow: subflows/login.yaml
- runFlow:
    when:
      true: ${ACCOUNT == 'mock'}
    commands:
      - assertVisible: '.*(${MOCK_NOTICE}).*'
- runFlow:
    file: subflows/tab.yaml
    env:
      TAB: 'tab-today|(sunrise|sun\.max|sunset|moon\.stars)\.fill'
# The section header may carry more text around the label.
- runFlow:
    when:
      true: ${ACCOUNT == 'mock'}
    commands:
      - assertVisible: '.*(${T_todayDueSoon}).*'
- runFlow:
    file: subflows/tab.yaml
    env:
      TAB: 'tab-assignments|list\.bullet\.clipboard\.fill'
- runFlow:
    when:
      true: ${ACCOUNT == 'mock'}
    commands:
      - assertVisible: '.*(${MOCK_ASSIGNMENT}).*'
- runFlow:
    file: subflows/tab.yaml
    env:
      TAB: 'tab-files|folder\.fill'
- runFlow:
    when:
      true: ${ACCOUNT == 'mock'}
    commands:
      - assertVisible: '.*(${MOCK_FILE}).*'
- runFlow:
    file: subflows/tab.yaml
    env:
      TAB: 'tab-courses|books\.vertical\.fill'
- runFlow:
    when:
      true: ${ACCOUNT == 'mock'}
    commands:
      - assertVisible: '.*(${MOCK_COURSE}).*'
      # On iOS a swipe from the screen's edge goes back from course details,
      # also when it starts on a card, which would otherwise take it.
      - runFlow:
          file: subflows/open.yaml
          env:
            CARD: '.*(${MOCK_COURSE}).*'
            DETAIL: course-detail
      - runFlow:
          file: subflows/back.yaml
          env:
            LIST: '${T_filter}'
      # iPad and unfolded Android show course details beside the list.
      - runFlow:
          when:
            platform: iOS
            true: ${IPAD != 'true'}
          commands:
            - assertNotVisible:
                id: course-detail
- runFlow:
    when:
      true: ${ACCOUNT == 'live'}
    commands:
      - extendedWaitUntil:
          visible:
            id: course-card
          timeout: 30000
- runFlow: subflows/settings.yaml
- assertVisible:
    id: settings-logout
- runFlow:
    file: subflows/tab.yaml
    env:
      TAB: 'tab-notices|bell\.fill'
- runFlow:
    when:
      true: ${ACCOUNT == 'mock'}
    commands:
      - assertVisible: '.*(${MOCK_NOTICE}).*'
