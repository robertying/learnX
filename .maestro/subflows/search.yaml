# Open search from the current list's header, type TERM and wait for a result
# matching RESULT. The search field is focused on open.
appId: ${APP_ID}
---
- tapOn: '${T_search}'
- inputText: ${TERM}
# In Chinese, Android's keyboard takes the letters as Pinyin and holds them
# until return commits them as typed.
- runFlow:
    when:
      platform: Android
    commands:
      - pressKey: Enter
# Maestro can drop a CJK character while typing, and on iOS the field can
# lose focus after the first letter (seen on the closed iPhone Duo, where
# what comes after, erasing included, then goes nowhere): retype until the
# field holds all of TERM, on iOS after tapping the field again, which reads
# as its placeholder whatever it holds.
- repeat:
    times: 2
    while:
      notVisible: ${TERM}
    commands:
      - runFlow:
          when:
            platform: iOS
          commands:
            - tapOn: '${T_searchPlaceholder}'
      - eraseText
      - inputText: ${TERM}
      - runFlow:
          when:
            platform: Android
          commands:
            - pressKey: Enter
- extendedWaitUntil:
    visible: ${RESULT}
    timeout: 5000
- runFlow:
    file: shot.yaml
    env:
      NAME: search
