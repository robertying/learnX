# Swipe the card matching CARD in DIRECTION (LEFT or RIGHT) and tap the action
# it shows, by its id ACTION (card-fav, card-archive). The swipe has to stop
# short of half the card, where letting go runs the action by itself. Maestro
# swipes to 10% from the screen's edge: from the card's middle that's short of
# it to the left, but to the right it's past it where the list ends before the
# screen does (the closed iPhone Duo, with its bars at the right), so a right
# swipe starts further along the card. In the split layout (SPLIT from
# scripts/e2e/e2e.sh: iPad, the open iPhone Duo) the list is a column on the
# left, so a right swipe crosses the whole card whatever its start: that's the
# full swipe, which runs the action by itself, with no button left to tap.
# A left swipe there is one too in landscape (ORIENTATION from
# scripts/e2e/e2e.sh), where the list column starts past the sidebar, so the
# 10% mark is more than half a card away.
appId: ${APP_ID}
---
- runFlow:
    when:
      true: ${DIRECTION == 'LEFT'}
    commands:
      - swipe:
          from:
            text: ${CARD}
          direction: LEFT
          duration: 300
- runFlow:
    when:
      true: ${DIRECTION == 'RIGHT'}
    commands:
      - swipe:
          from:
            text: ${CARD}
            point: 70%, 50%
          direction: RIGHT
          duration: 300
- runFlow:
    when:
      true: ${SPLIT != 'true' || (DIRECTION == 'LEFT' && ORIENTATION == 'PORTRAIT')}
    commands:
      - tapOn:
          id: ${ACTION}
- waitForAnimationToEnd
