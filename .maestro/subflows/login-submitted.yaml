# After the mock account's password is submitted on the login page: closes
# the offer to save the password (save-password.yaml), then the set-up page
# that a typed mock login opens, since it starts over from the mock data
# (data/login.ts). Reached from login-form.yaml and 10-errors.
appId: ${APP_ID}
---
- runFlow:
    file: save-password.yaml
    env:
      SHOWN: '${T_setupTitle}'
      STAYED: '${T_login}'
# On the closed iPhone Duo the password sometimes doesn't reach its field,
# and the login page stays: then its Log In button is what showed, and the
# password goes in again.
- runFlow:
    when:
      true: "${T_login.split('|').indexOf(maestro.copiedText) >= 0}"
    commands:
      - tapOn:
          id: login-password
      - inputText: ${PASSWORD}
      - pressKey: Enter
      - runFlow:
          file: save-password.yaml
          env:
            SHOWN: '${T_setupTitle}'
            STAYED: '${T_login}'
- tapOn:
    id: setup-not-now
