# Log in from the welcome or login page with the mock account, then close the
# set-up page that a first login opens. Reached from login.yaml.
appId: ${APP_ID}
env:
  SAVE_PASSWORD: 'Save Password\??|存储密码？?|要存储密码吗？?'
---
- tapOn:
    id: welcome-continue
    optional: true
- extendedWaitUntil:
    visible:
      id: login-username
    timeout: 10000
- tapOn:
    id: login-username
- inputText: ${USERNAME}
# Return moves the focus to the password field. A tap alone sometimes misses
# it in iPad landscape, and the password ends up in the account field; the
# tap is then a no-op on the focused field.
- pressKey: Enter
- tapOn:
    id: login-password
- inputText: ${PASSWORD}
# The password field submits the login on return.
- pressKey: Enter
# Next comes the set-up page, over Today. On some iOS devices a "Save
# Password?" alert (the system's own labels) comes first and hides the app's
# accessibility tree until dismissed. Wait for whichever shows, then read
# which it is: a condition on an absent element would cost Maestro's 7 s
# optional lookup. On the closed iPhone Duo the password sometimes doesn't
# reach its field, and the login page stays: then its Log In button is what
# shows, and the password goes in again.
- extendedWaitUntil:
    visible: '${SAVE_PASSWORD}|${T_setupTitle}'
    timeout: 15000
    optional: true
- copyTextFrom: '${SAVE_PASSWORD}|${T_setupTitle}|${T_login}'
# (No regex in these scripts: Maestro leaves a script with a `$` in it
# unevaluated, and the raw text counts as true.)
- runFlow:
    when:
      true: "${T_login.split('|').indexOf(maestro.copiedText) >= 0}"
    commands:
      - tapOn:
          id: login-password
      - inputText: ${PASSWORD}
      - pressKey: Enter
      - extendedWaitUntil:
          visible: '${SAVE_PASSWORD}|${T_setupTitle}'
          timeout: 30000
      - copyTextFrom: '${SAVE_PASSWORD}|${T_setupTitle}'
# Anything but the set-up title is the alert.
- runFlow:
    when:
      true: "${T_setupTitle.split('|').indexOf(maestro.copiedText) < 0}"
    commands:
      - tapOn: 'Not Now|现在不|以后'
- tapOn:
    id: setup-not-now
