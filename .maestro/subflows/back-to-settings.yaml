# Back from a Settings page to Settings, unless the page opened beside it
# (the split layout, unfolded Android).
appId: ${APP_ID}
---
- runFlow:
    when:
      platform: Android
      notVisible:
        id: settings-list
    commands:
      - back
- runFlow:
    when:
      platform: iOS
      true: ${IOS_MAJOR >= 26}
      notVisible:
        id: settings-list
    commands:
      - swipe:
          start: 1%, 50%
          end: 80%, 50%
          duration: 400
- waitForAnimationToEnd
# Before iOS 26 only a pan from the very edge pops, which XCTest's swipe
# doesn't reliably start (in the system's own apps either), and the swipe can
# land as a tap on a row: tap the back button, the bar's first item, instead.
- runFlow:
    when:
      platform: iOS
      true: ${IOS_MAJOR < 26}
      notVisible:
        id: settings-list
    commands:
      - tapOn:
          point: 5%, 8%
      - waitForAnimationToEnd
