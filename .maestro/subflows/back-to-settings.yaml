# Back from a Settings page to Settings, unless the page opened beside it (the
# split layout, unfolded Android): back.yaml on iOS; on Android while Settings'
# list, which has no label of its own to pass as back.yaml's LIST, is still
# visible.
appId: ${APP_ID}
---
- runFlow:
    when:
      platform: Android
      notVisible:
        id: settings-list
    commands:
      - back
      - waitForAnimationToEnd
- runFlow:
    when:
      platform: iOS
    file: back.yaml
