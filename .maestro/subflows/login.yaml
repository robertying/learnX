# Open the app logged in with the mock account (see src/data/AGENTS.md, Mock
# login), on the notices. The flows share one login: the first flow of a run
# logs in after 00-reset, the others find the app logged in and only relaunch
# it. USERNAME / PASSWORD / APP_ID are passed with -e by scripts/e2e.sh.
appId: ${APP_ID}
---
# ORIENTATION comes from scripts/e2e.sh (PORTRAIT unless E2E_ORIENTATION is
# set), so iPad landscape runs need no rotating by hand.
- setOrientation: ${ORIENTATION}
# Every launch: no emulated server delay (services/launchOptions.ts), and with
# APP_LANGUAGE (from scripts/e2e.sh, empty by default, e.g. zh-Hans) iOS in
# that language. Android takes the app's locale from
# `cmd locale set-app-locales` instead (scripts/store-screenshots.sh).
- runFlow:
    when:
      true: ${!APP_LANGUAGE && ACCOUNT != 'live'}
    commands:
      - launchApp:
          arguments:
            mockLatency: none
- runFlow:
    when:
      true: ${!!APP_LANGUAGE}
    commands:
      - launchApp:
          arguments:
            mockLatency: none
            AppleLanguages: '(${APP_LANGUAGE})'
# Live runs (scripts/e2e.sh --live) hand the app the live account's saved
# fingerprint, so typing its username signs in without the SSO page
# (services/launchOptions.ts). Only E2E_LIVE builds take it.
- runFlow:
    when:
      true: ${!APP_LANGUAGE && ACCOUNT == 'live'}
    commands:
      - launchApp:
          arguments:
            liveUsername: ${USERNAME}
            liveFingerprint: ${LIVE_FINGERPRINT}
# A new install opens on the welcome page, a logged-out app on the login
# page, a logged-in one on its tabs.
- extendedWaitUntil:
    visible:
      id: 'welcome-continue|login-username|tab-notices|bell\.fill'
    timeout: 60000
# Logged in already: an absent element costs Maestro's optional lookup (up to
# 7 s from the launch), still far less than a login.
- runFlow:
    when:
      visible:
        id: 'welcome-continue|login-username'
    file: login-form.yaml
# The app opens on Today; the flows start from the notices.
- runFlow:
    file: tab.yaml
    env:
      TAB: 'tab-notices|bell\.fill'
