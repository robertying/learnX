# Fresh install state, then log in with the mock account (see src/data/AGENTS.md, Mock login).
# USERNAME / PASSWORD / APP_ID are passed with -e by scripts/e2e.sh.
appId: ${APP_ID}
---
# ORIENTATION comes from scripts/e2e.sh (PORTRAIT unless E2E_ORIENTATION is
# set), so iPad landscape runs need no rotating by hand.
- setOrientation: ${ORIENTATION}
# APP_LANGUAGE (from scripts/e2e.sh, empty by default) launches iOS in that
# language, e.g. zh-Hans. Android takes the app's locale from
# `cmd locale set-app-locales`, which clearing the app's data also clears, so
# scripts/store-screenshots.sh clears it before setting the locale and passes
# STATE_CLEARED to launch the app as it is.
- runFlow:
    when:
      true: ${!!STATE_CLEARED}
    commands:
      - launchApp
- runFlow:
    when:
      true: ${!APP_LANGUAGE && !STATE_CLEARED && ACCOUNT != 'live'}
    commands:
      - launchApp:
          clearState: true
          clearKeychain: true
# Live runs (scripts/e2e.sh --live) hand the app the live account's saved
# fingerprint, so typing its username signs in without the SSO page
# (helpers/launchOptions.ts). Only E2E_LIVE builds take it.
- runFlow:
    when:
      true: ${!APP_LANGUAGE && !STATE_CLEARED && ACCOUNT == 'live'}
    commands:
      - launchApp:
          clearState: true
          clearKeychain: true
          arguments:
            liveUsername: ${USERNAME}
            liveFingerprint: ${LIVE_FINGERPRINT}
- runFlow:
    when:
      true: ${!!APP_LANGUAGE}
    commands:
      - launchApp:
          clearState: true
          clearKeychain: true
          arguments:
            AppleLanguages: '(${APP_LANGUAGE})'
# A new install opens on the welcome page.
- extendedWaitUntil:
    visible:
      id: 'welcome-continue|login-username'
    timeout: 60000
- tapOn:
    id: welcome-continue
    optional: true
- extendedWaitUntil:
    visible:
      id: login-username
    timeout: 10000
- tapOn:
    id: login-username
- inputText: ${USERNAME}
- tapOn:
    id: login-password
- inputText: ${PASSWORD}
# The password field submits the login on return.
- pressKey: Enter
# iOS offers to save the password to the keychain after a login; the alert
# hides the app's accessibility tree until dismissed. The system's own labels.
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: 'Save Password\??|存储密码？?|要存储密码吗？?'
          timeout: 10000
          optional: true
      - tapOn:
          text: 'Not Now|现在不|以后'
          optional: true
# The set-up page opens over Today after the first login, and can hide the
# tab bar from Maestro before it is seen.
- extendedWaitUntil:
    visible:
      id: 'tab-notices|bell\.fill|setup-not-now'
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: setup-not-now
    timeout: 5000
    optional: true
- tapOn:
    id: setup-not-now
    optional: true
# The app opens on Today; the flows start from the notices.
- runFlow:
    file: tab.yaml
    env:
      TAB: 'tab-notices|bell\.fill'
