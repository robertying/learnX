# Leaving the login page after a typed password, some iOS devices offer to
# save it (an alert with the system's own labels), which hides the app's
# accessibility tree until dismissed. Waits for whichever comes, the alert or
# SHOWN (what the app shows next, as a text pattern), and closes the alert if
# it was that: an optional tap would wait out Maestro's 7 s lookup on every
# device that doesn't ask. STAYED is what's still there if the tap or the
# return key that left the page didn't take: it's read only after the wait,
# since it's on screen until the page goes. `maestro.copiedText` is left
# with what showed, for the caller to branch on.
appId: ${APP_ID}
env:
  SAVE_PASSWORD: 'Save Password\??|存储密码？?|要存储密码吗？?|保存密码[?？]?'
---
- extendedWaitUntil:
    visible: '${SAVE_PASSWORD}|${SHOWN}'
    timeout: 15000
    optional: true
- copyTextFrom: '${SAVE_PASSWORD}|${SHOWN}|${STAYED}'
# Anything SHOWN and STAYED don't list is the alert. (No regex in these
# scripts: Maestro leaves a script with a `$` in it unevaluated, and the raw
# text counts as true.)
- runFlow:
    when:
      true: "${(SHOWN + '|' + STAYED).split('|').indexOf(maestro.copiedText) < 0}"
    commands:
      - tapOn: 'Not Now|现在不|以后'
