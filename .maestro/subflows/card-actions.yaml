# Open the actions menu of the list card titled CARD: a long press shows the
# context menu on iOS and the Material menu on Android. Tap an item by its
# text, which both platforms' menus show. Swipes run one action each way,
# but on iPad Maestro's element swipe is too short and lands as a tap.
appId: ${APP_ID}
---
- longPressOn: ${CARD}
- waitForAnimationToEnd
