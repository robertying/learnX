# Leave a page about the open item (an assignment's submission, a course's
# courseX). Beside a detail pane (SPLIT from scripts/e2e/e2e.sh: iPad, the
# open iPhone Duo) it's pushed in the detail column, so its back button
# leaves it; elsewhere it's a sheet, which close.yaml closes.
# App-wide pages (search, every course's courseX) are always sheets: close
# them with close.yaml.
appId: ${APP_ID}
---
- evalScript: ${output.leftItemPage = false}
- runFlow:
    when:
      platform: iOS
      true: ${SPLIT == 'true'}
    commands:
      - runFlow:
          when:
            visible:
              id: BackButton
          commands:
            - tapOn:
                id: BackButton
            - evalScript: ${output.leftItemPage = true}
- runFlow:
    when:
      true: ${!output.leftItemPage}
    commands:
      - runFlow: close.yaml
- waitForAnimationToEnd
