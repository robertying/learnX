# Close what opened as a sheet (search, every course's courseX, and pages
# about the open item where they're sheets, close-item-page.yaml): its Close
# button on iOS, the system back on Android (hide a keyboard that's up first).
appId: ${APP_ID}
---
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: '${T_close}'
- runFlow:
    when:
      platform: Android
    commands:
      - back
- waitForAnimationToEnd
