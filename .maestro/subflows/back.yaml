# Leave a pushed detail screen. Skipped while LIST (a label on the list
# screen) is still visible, i.e. when the detail opened beside the list in a
# split view (iPad) instead of being pushed over it.
appId: ${APP_ID}
---
- runFlow:
    when:
      platform: Android
      notVisible: ${LIST}
    commands:
      - back
- runFlow:
    when:
      platform: iOS
      true: ${IOS_MAJOR >= 26}
      notVisible: ${LIST}
    commands:
      # Interactive pop from the left edge; there's no system back on iOS.
      - swipe:
          start: 1%, 50%
          end: 80%, 50%
          duration: 400
- waitForAnimationToEnd
# Before iOS 26 only a pan from the very edge pops, which XCTest's swipe
# doesn't reliably start (in the system's own apps either), and the swipe can
# land as a tap on a row: tap the back button, the bar's first item, instead.
- runFlow:
    when:
      platform: iOS
      true: ${IOS_MAJOR < 26}
      notVisible: ${LIST}
    commands:
      - tapOn:
          point: 5%, 8%
      - waitForAnimationToEnd
