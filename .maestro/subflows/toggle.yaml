# Flip the switch of the settings row with id ID and check that it is then on
# when ON is 'true', off otherwise. On iOS a tap must land on the switch
# itself, which reads as 1 or 0; on Android the whole row toggles. CONFIRM, if
# set, is the button that confirms the alert the switch asks first. LIST is the
# page's list: the row is scrolled to first (down only), since how many rows
# a page shows depends on the screen (fewer on the closed iPhone Duo). A flow
# going back up to an earlier row scrolls there itself (scroll-to-top.yaml).
appId: ${APP_ID}
---
- runFlow:
    file: scroll-to-id.yaml
    env:
      LIST: ${LIST}
      ID: ${ID}
- runFlow:
    when:
      platform: iOS
    commands:
      # A row cut off at the screen's lower edge counts as shown, but its
      # switch is left out of the hierarchy until it's on screen too, and the
      # tap below would then land on the row's middle (the half-open iPhone
      # Duo): swipe once more when the switch isn't there.
      - evalScript: ${output.switchShown = false}
      - runFlow:
          when:
            visible:
              id: ${ID}
              containsChild:
                text: '0|1'
          commands:
            - evalScript: ${output.switchShown = true}
      - runFlow:
          when:
            true: ${!output.switchShown}
          commands:
            - runFlow:
                file: swipe-list.yaml
                env:
                  LIST: ${LIST}
                  DIRECTION: UP
      - tapOn:
          text: '0|1'
          childOf:
            id: ${ID}
      - runFlow:
          when:
            true: ${!!CONFIRM}
          commands:
            - tapOn: ${CONFIRM}
      - extendedWaitUntil:
          visible:
            text: "${ON == 'true' ? '1' : '0'}"
            childOf:
              id: ${ID}
          timeout: 10000
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: ${ID}
      - runFlow:
          when:
            true: ${!!CONFIRM}
          commands:
            - tapOn: ${CONFIRM}
      - runFlow:
          when:
            true: ${ON == 'true'}
          commands:
            - extendedWaitUntil:
                visible:
                  id: ${ID}
                  checked: true
                timeout: 10000
      - runFlow:
          when:
            true: ${ON != 'true'}
          commands:
            - extendedWaitUntil:
                visible:
                  id: ${ID}
                  checked: false
                timeout: 10000
