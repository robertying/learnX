# Open Settings: from Today's header on phones, iPad and Android, from the
# sidebar on Mac (which Maestro doesn't drive).
appId: ${APP_ID}
---
- runFlow:
    file: tab.yaml
    env:
      TAB: 'tab-today|(sunrise|sun\.max|sunset|moon\.stars)\.fill'
# The iOS header button only exposes its label; Android's has the same one.
# With the "new" badge, Maestro reads the iOS button as the badge's value,
# UIKit's own text, not the label; Android reads the badge after the label.
- tapOn: '(${T_settings})(, .*)?|New items?|新项目'
