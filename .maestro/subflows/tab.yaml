# Switch to the tab whose id matches TAB, e.g. 'tab-files|folder\.fill'
# (the SF Symbol covers iOS tab bar buttons that lose their identifier in
# Maestro's snapshot after a clearState launch).
appId: ${APP_ID}
---
# Phones, Android and Mac: one tap. IPAD comes from scripts/e2e.sh; checking
# for the iPad page buttons instead would cost Maestro's 7 s optional lookup
# on every other device.
- runFlow:
    when:
      true: ${IPAD != 'true'}
    commands:
      - tapOn:
          id: ${TAB}
# On iPad the tabs sit in a paged top bar, and a tab on the other page is
# laid out outside it: turn the page and tap again. The page buttons are
# UIKit's, so their labels aren't in the app's translations.
- runFlow:
    when:
      true: ${IPAD == 'true'}
    commands:
      - tapOn:
          id: ${TAB}
          # Absent from the snapshot while it's on the other page.
          optional: true
      - runFlow:
          when:
            visible: 'Next Page|下一页'
            notVisible:
              id: ${TAB}
              selected: true
          commands:
            - tapOn: 'Next Page|下一页'
            - tapOn:
                id: ${TAB}
      - runFlow:
          when:
            visible: 'Previous Page|上一页'
            notVisible:
              id: ${TAB}
              selected: true
          commands:
            - tapOn: 'Previous Page|上一页'
            - tapOn:
                id: ${TAB}
