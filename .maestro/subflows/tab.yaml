# Switch to the tab whose id matches TAB, e.g. 'tab-files|folder\.fill'
# (the SF Symbol covers iOS tab bar buttons that lose their identifier in
# Maestro's snapshot after a clearState launch).
appId: ${APP_ID}
---
# iPad (IPAD from scripts/e2e.sh): the tab bar pages only when its labels
# don't fit (English, portrait). Then page 1 shows Today to Files with a Next
# Page button over Courses, and page 2 a Previous Page button with Notices to
# Courses, so only Today and Courses may need a page turn first. Checking for
# a page button that isn't there costs Maestro's 7 s lookup, so other tabs and
# other devices skip it. The buttons are UIKit's, so their labels aren't in
# the app's translations.
- runFlow:
    when:
      true: ${IPAD == 'true' && /tab-today/.test(TAB)}
    commands:
      - runFlow:
          when:
            visible: 'Previous Page|上一页'
          commands:
            - tapOn: 'Previous Page|上一页'
- runFlow:
    when:
      true: ${IPAD == 'true' && /tab-courses/.test(TAB)}
    commands:
      - runFlow:
          when:
            visible: 'Next Page|下一页'
          commands:
            - tapOn: 'Next Page|下一页'
- tapOn:
    id: ${TAB}
