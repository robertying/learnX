# iOS: open the system Reminders app's All list and check that a reminder
# matching MATCH is in it when FOUND is 'true', or isn't otherwise. Goes back
# to the lists, where Reminders opens next time, and leaves it in front.
appId: com.apple.reminders
---
- launchApp:
    stopApp: true
- runFlow:
    file: system-app-start.yaml
    env:
      READY: '(All|全部), .*'
- tapOn: '(All|全部), .*'
- runFlow:
    when:
      true: ${FOUND == 'true'}
    commands:
      - extendedWaitUntil:
          visible: ${MATCH}
          timeout: 10000
- runFlow:
    when:
      true: ${FOUND != 'true'}
    commands:
      - assertNotVisible: ${MATCH}
# The back button has an id from iOS 26 on (IOS_MAJOR, scripts/e2e/e2e.sh); before,
# only its label.
- runFlow:
    when:
      true: ${IOS_MAJOR >= 26}
    commands:
      - tapOn:
          id: BackButton
- runFlow:
    when:
      true: ${IOS_MAJOR < 26}
    commands:
      - tapOn: 'Lists|列表'
