# iOS: search the system Calendar app for QUERY and check that an event
# matching MATCH is listed when FOUND is 'true', or isn't otherwise. Leaves
# Calendar in front.
appId: com.apple.mobilecal
---
# On the open iPhone Duo the system app's tree lacks its right side (the
# inner-display fix, scripts/e2e/sim-ax-frame.m, doesn't take in the system apps),
# where its buttons are, so the Duo is closed first; back-to-app.yaml opens
# it again.
- runFlow:
    when:
      true: ${!!DUO_POSTURE}
    file: fold.yaml
    env:
      POSTURE: closed
- launchApp:
    stopApp: true
- runFlow:
    file: system-app-start.yaml
    env:
      READY: 'Search|搜索'
# By its label: the closed iPhone Duo moves it to the bar at the side, where
# it has no id.
- tapOn: 'Search|搜索'
- inputText: ${QUERY}
- runFlow:
    when:
      true: ${FOUND == 'true'}
    commands:
      - extendedWaitUntil:
          visible: ${MATCH}
          timeout: 10000
- runFlow:
    when:
      true: ${FOUND != 'true'}
    commands:
      - assertNotVisible: ${MATCH}
