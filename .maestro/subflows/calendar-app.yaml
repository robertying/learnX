# iOS: search the system Calendar app for QUERY and check that an event
# matching MATCH is listed when FOUND is 'true', or isn't otherwise. Leaves
# Calendar in front.
appId: com.apple.mobilecal
---
- launchApp:
    stopApp: true
- runFlow:
    file: system-app-start.yaml
    env:
      READY: 'Search|搜索'
# By its label: the closed iPhone Duo moves it to the bar at the side, where
# it has no id.
- tapOn: 'Search|搜索'
- inputText: ${QUERY}
- runFlow:
    when:
      true: ${FOUND == 'true'}
    commands:
      - extendedWaitUntil:
          visible: ${MATCH}
          timeout: 10000
- runFlow:
    when:
      true: ${FOUND != 'true'}
    commands:
      - assertNotVisible: ${MATCH}
