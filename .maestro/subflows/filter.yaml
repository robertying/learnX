# Switch the current list's filter to the one labelled LABEL, from the filter
# button's pull-down menu. LABEL is a regex such as '(${T_fav})(, .*)?', since
# iOS reads the count after the label.
appId: ${APP_ID}
---
- tapOn: '${T_filter}'
- waitForAnimationToEnd
- tapOn: ${LABEL}
- waitForAnimationToEnd
