# Scroll a list until TARGET (a text regex) is on screen, by swiping the list
# itself (LIST, its testID; swipe-list.yaml): DIRECTION UP shows what's
# further down, DOWN goes back up. Not scrollUntilVisible: it swipes the
# middle of the screen, which is the detail pane in a split view (iPad, the
# open iPhone Duo, the unfolded foldable).
appId: ${APP_ID}
---
- runFlow:
    file: swipe-until-shown.yaml
    env:
      LIST: ${LIST}
      ID: ''
      TEXT: ${TARGET}
      DIRECTION: ${DIRECTION}
