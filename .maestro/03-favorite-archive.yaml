appId: ${APP_ID}
name: Favorite and archive a notice
---
# Checks the outcome of each action, not its toast: on iOS the Liquid Glass
# toast keeps the screen from settling, so Maestro's settle wait outlasts a
# 3 s toast. Toasts are covered by Jest (components/__tests__/Toast.test.tsx).
- runFlow: subflows/login.yaml

# Favorite
- runFlow:
    file: subflows/card-actions.yaml
    env:
      CARD: '.*(${MOCK_NOTICE}).*'
- tapOn: '${T_favorite}'
- runFlow:
    file: subflows/filter.yaml
    env:
      LABEL: '(${T_fav})(, .*)?'
- assertVisible: '.*(${MOCK_NOTICE}).*'

# Unfavorite from the favorites list
- runFlow:
    file: subflows/card-actions.yaml
    env:
      CARD: '.*(${MOCK_NOTICE}).*'
- tapOn: '${T_unfavorite}'
- assertNotVisible: '.*(${MOCK_NOTICE}).*'

# Archive from the full list
- runFlow:
    file: subflows/filter.yaml
    env:
      LABEL: '(${T_all})(, .*)?'
- runFlow:
    file: subflows/card-actions.yaml
    env:
      CARD: '.*(${MOCK_NOTICE}).*'
- tapOn: '${T_archive}'
- assertNotVisible: '.*(${MOCK_NOTICE}).*'
- runFlow:
    file: subflows/filter.yaml
    env:
      LABEL: '(${T_archived})(, .*)?'
- assertVisible: '.*(${MOCK_NOTICE}).*'

# Unarchive it
- runFlow:
    file: subflows/card-actions.yaml
    env:
      CARD: '.*(${MOCK_NOTICE}).*'
- tapOn: '${T_restore}'
- runFlow:
    file: subflows/filter.yaml
    env:
      LABEL: '(${T_all})(, .*)?'
- assertVisible: '.*(${MOCK_NOTICE}).*'

# The same from the card's swipe actions: to the left Favorite, to the right
# Archive (the defaults, data/settings.ts); each again undoes it.
# iOS only: Maestro's swipe on Android stops short of the half-card full swipe
# that runs the action there (Android shows no button to tap); Jest covers it
# (components/__tests__/android/CardWrapper.test.tsx).
- runFlow:
    when:
      platform: iOS
    commands:
      - runFlow:
          file: subflows/swipe-card.yaml
          env:
            CARD: '.*(${MOCK_NOTICE}).*'
            DIRECTION: LEFT
            ACTION: card-fav
      - runFlow:
          file: subflows/filter.yaml
          env:
            LABEL: '(${T_fav})(, .*)?'
      - assertVisible: '.*(${MOCK_NOTICE}).*'
      - runFlow:
          file: subflows/swipe-card.yaml
          env:
            CARD: '.*(${MOCK_NOTICE}).*'
            DIRECTION: LEFT
            ACTION: card-fav
      - extendedWaitUntil:
          notVisible: '.*(${MOCK_NOTICE}).*'
          timeout: 5000
      - runFlow:
          file: subflows/filter.yaml
          env:
            LABEL: '(${T_all})(, .*)?'
      - runFlow:
          file: subflows/swipe-card.yaml
          env:
            CARD: '.*(${MOCK_NOTICE}).*'
            DIRECTION: RIGHT
            ACTION: card-archive
      - extendedWaitUntil:
          notVisible: '.*(${MOCK_NOTICE}).*'
          timeout: 5000
      - runFlow:
          file: subflows/filter.yaml
          env:
            LABEL: '(${T_archived})(, .*)?'
      - runFlow:
          file: subflows/swipe-card.yaml
          env:
            CARD: '.*(${MOCK_NOTICE}).*'
            DIRECTION: RIGHT
            ACTION: card-archive
      - extendedWaitUntil:
          notVisible: '.*(${MOCK_NOTICE}).*'
          timeout: 5000
      - runFlow:
          file: subflows/filter.yaml
          env:
            LABEL: '(${T_all})(, .*)?'
      - assertVisible: '.*(${MOCK_NOTICE}).*'
