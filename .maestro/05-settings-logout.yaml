appId: ${APP_ID}
name: Open settings pages and log out
tags:
  - live
---
- runFlow: subflows/login.yaml
- runFlow: subflows/settings.yaml
# Scroll to the end of Settings: About is the last row. It can first come
# into view under the floating tab bar, where a tap lands on a tab, so swipe
# once more; at the end of the list that leaves it above the tab bar, with
# Changelog three rows up.
- runFlow:
    file: subflows/scroll-list.yaml
    env:
      LIST: settings-list
      TARGET: '.*(${T_about}).*'
      DIRECTION: UP
- swipe:
    from:
      id: settings-list
    direction: UP
# Changelog before About: on iPad the page it opens beside the list is a web
# view, which would keep the logout alert out of Maestro's snapshot.
- tapOn: '.*(${T_changelog}).*'
- runFlow:
    file: subflows/back.yaml
    env:
      LIST: '.*(${T_about}).*'
- tapOn: '.*(${T_about}).*'
- assertVisible: '.*© \d+ Rui Ying.*'
- runFlow:
    file: subflows/back.yaml
    env:
      # Not About: the About page's title matches that too.
      LIST: '.*(${T_helpAndFeedback}).*'
- runFlow:
    file: subflows/scroll-list.yaml
    env:
      LIST: settings-list
      TARGET: '.*(${T_logout}).*'
      DIRECTION: DOWN
# Once more: iOS keeps rows that scrolled under the navigation bar in its
# snapshot, so Log Out can count as visible while a tap on it lands on the
# status bar. At the top of the list this swipe does nothing.
- swipe:
    from:
      id: settings-list
    direction: DOWN

- tapOn:
    id: settings-logout
# The alert's button is the Settings row's label without its ellipsis. On
# Android the dialog's button has a fixed id.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: '${T_logout}'
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: 'android:id/button1'
- extendedWaitUntil:
    visible:
      # After a logout iOS may drop the field's own identifier from the
      # snapshot; TextField's label keeps a derived one.
      id: 'login-username(-label)?'
    timeout: 10000
