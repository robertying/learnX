appId: ${APP_ID}
name: Search and open a result
---
- runFlow: subflows/login.yaml
- tapOn: 'Search|搜索'
# The search bar is focused on open. ASCII only: Android can't type CJK.
- inputText: 'AutoCAD'
- extendedWaitUntil:
    visible: '.*AutoCAD绘图基础练习.*'
    timeout: 5000
# The results list spends the first tap on dismissing the keyboard, so spend
# it on the section header (hideKeyboard is flaky on iOS).
- tapOn: 'Assignments|作业'
- tapOn: '.*AutoCAD绘图基础练习.*'
- extendedWaitUntil:
    visible:
      id: assignment-detail
    timeout: 10000
