appId: ${APP_ID}
name: Search and open a result
---
- runFlow: subflows/login.yaml
- tapOn: '${T_search}'
# The search field is focused on open.
- inputText: ${MOCK_SEARCH_TERM}
# Results are grouped by kind, notices first; the keyboard and the search
# field cover the rest on phones, so open the notice.
- extendedWaitUntil:
    visible: '.*(${MOCK_SEARCH_NOTICE}).*'
    timeout: 5000
- assertVisible: '.*(${MOCK_SEARCH_ASSIGNMENT}).*'
# While the search field has focus, the results list may spend the first tap
# on blurring it, so tap again if needed.
- tapOn: '.*(${MOCK_SEARCH_NOTICE}).*'
- waitForAnimationToEnd
- runFlow:
    when:
      notVisible:
        id: notice-detail
    commands:
      - tapOn: '.*(${MOCK_SEARCH_NOTICE}).*'
- extendedWaitUntil:
    visible:
      id: notice-detail
    timeout: 10000
