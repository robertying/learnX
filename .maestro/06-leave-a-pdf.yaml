appId: ${APP_ID}
name: Leave a PDF while it renders
# patches/react-native-pdf@7.0.5.patch: on Android, leaving the file screen
# while its pages rendered closed the document under the renderer thread, and
# the app crashed in Pdfium. Each round leaves as soon as the PDF has loaded,
# while its pages are still rendering.
---
- runFlow: subflows/login.yaml
- runFlow:
    file: subflows/tab.yaml
    env:
      TAB: 'tab-files|folder\.fill'
- repeat:
    times: 5
    commands:
      - runFlow:
          file: subflows/open.yaml
          env:
            CARD: '.*(${MOCK_FILE}).*'
            DETAIL: file-detail
      - extendedWaitUntil:
          notVisible:
            id: file-loading
          timeout: 30000
      - runFlow:
          file: subflows/back.yaml
          env:
            LIST: '${T_filter}'
# Still running.
- assertVisible: '.*(${MOCK_FILE}).*'
