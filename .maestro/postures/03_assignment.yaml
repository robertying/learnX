appId: ${APP_ID}
name: Open an assignment on the open iPhone Duo
---
# Run by scripts/e2e-devices.sh on the iPhone Duo, already logged in: opens
# the screen from its learnx:// link (mock data ids, checked by
# src/helpers/__tests__/e2ePostures.test.ts) and checks it on the inner display.
- runFlow:
    file: ../subflows/open_on_inner.yaml
    env:
      LINK: 'learnx://assignment/26ef84e76db3f55b016d000000000001'
      ID: assignment-detail
