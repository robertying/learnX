appId: ${APP_ID}
name: Open a notice, an assignment and a file
# Live runs (scripts/e2e.sh --live) open the first item of each list instead,
# so the account needs a notice, an assignment and a file this semester.
tags:
  - live
---
- runFlow: subflows/login.yaml

- runFlow:
    file: subflows/open.yaml
    env:
      CARD: '.*(${MOCK_NOTICE}).*'
      CARD_ID: notice-card
      DETAIL: notice-detail
- runFlow:
    file: subflows/back.yaml
    env:
      LIST: '${T_filter}'

- runFlow:
    file: subflows/tab.yaml
    env:
      TAB: 'tab-assignments|list\.bullet\.clipboard\.fill'
- runFlow:
    file: subflows/open.yaml
    env:
      CARD: '.*(${MOCK_ASSIGNMENT}).*'
      CARD_ID: assignment-card
      DETAIL: assignment-detail
- runFlow:
    when:
      true: ${ACCOUNT == 'mock'}
    commands:
      - assertVisible: '.*(${MOCK_ASSIGNMENT_ATTACHMENT}).*'
- runFlow:
    file: subflows/back.yaml
    env:
      LIST: '${T_filter}'

- runFlow:
    file: subflows/tab.yaml
    env:
      TAB: 'tab-files|folder\.fill'
# The screen shows right away; the file itself downloads in the background.
- runFlow:
    file: subflows/open.yaml
    env:
      CARD: '.*(${MOCK_FILE}).*'
      CARD_ID: file-card
      DETAIL: file-detail
- runFlow:
    file: subflows/back.yaml
    env:
      LIST: '${T_filter}'
