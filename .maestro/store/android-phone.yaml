appId: ${APP_ID}
name: Google Play screenshots on an Android phone
---
# Run by scripts/e2e/store-screenshots.sh (android-phone): the phone shots of
# the Play listing, as STORE_OUT/NN-<slug>.png.
- runFlow: subflows/start.yaml

# 1 Today
- runFlow: subflows/today.yaml
- runFlow:
    file: ../subflows/screenshot.yaml
    env:
      NAME: 01-today

# 2 Notices with the filter menu open
- runFlow:
    file: ../subflows/tab.yaml
    env:
      TAB: 'tab-notices'
# Plain, for the Play feature graphic
- runFlow:
    file: ../subflows/screenshot.yaml
    env:
      NAME: 02-notices-plain
# The filter menu open. Android's swipe actions run on release and leave
# nothing showing, so no card shows its actions.
- tapOn: '${T_filter}'
- runFlow:
    file: ../subflows/screenshot.yaml
    env:
      NAME: 02-notices
- tapOn: '(${T_all})(, .*)?'
- waitForAnimationToEnd

# 3 A notice with an attachment
- runFlow:
    file: ../subflows/open.yaml
    env:
      CARD: '.*(${MOCK_STORE_NOTICE}).*'
      DETAIL: notice-detail
# Its body is a web view that renders after the screen shows.
- extendedWaitUntil:
    visible: '.*(${MOCK_STORE_NOTICE_BODY}).*'
    timeout: 15000
- runFlow:
    file: ../subflows/screenshot.yaml
    env:
      NAME: 03-notice-detail
- back
- waitForAnimationToEnd

# 4 Assignments, all of them
- runFlow:
    file: ../subflows/tab.yaml
    env:
      TAB: 'tab-assignments'
- runFlow:
    file: ../subflows/filter.yaml
    env:
      LABEL: '(${T_all})(, .*)?'
- runFlow:
    file: ../subflows/screenshot.yaml
    env:
      NAME: 04-assignments

# 5 Files
- runFlow:
    file: ../subflows/tab.yaml
    env:
      TAB: 'tab-files'
- runFlow:
    file: ../subflows/screenshot.yaml
    env:
      NAME: 05-files

# 6 A PDF
- runFlow: subflows/file.yaml
- runFlow:
    file: ../subflows/screenshot.yaml
    env:
      NAME: 06-file
- back
- waitForAnimationToEnd

# 7 Courses
- runFlow:
    file: ../subflows/tab.yaml
    env:
      TAB: 'tab-courses'
- runFlow:
    file: ../subflows/screenshot.yaml
    env:
      NAME: 07-courses

# 8 Search
- runFlow:
    file: ../subflows/tab.yaml
    env:
      TAB: 'tab-notices'
- runFlow:
    file: ../subflows/search.yaml
    env:
      TERM: ${STORE_SEARCH_TERM}
      RESULT: '.*(${MOCK_NOTICE}).*'
# Hides the keyboard; Maestro's hideKeyboard is the back key, which clears
# the query.
- pressKey: Escape
- waitForAnimationToEnd
- runFlow:
    file: ../subflows/screenshot.yaml
    env:
      NAME: 08-search
