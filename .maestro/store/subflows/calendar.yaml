# Open Settings › Calendars and Reminders (iOS) or Calendar (Android), with
# its first two syncs on.
appId: ${APP_ID}
---
- runFlow: ../../subflows/settings.yaml
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: '.*(${T_calendarsAndReminders}).*'
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: '.*(${T_setupCalendarSection}).*'
- waitForAnimationToEnd
# With the class schedule and the assignments synced to the calendar.
- runFlow:
    file: ../../subflows/toggle.yaml
    env:
      LIST: calendar-settings
      ID: calendar-course-sync
      ON: 'true'
- runFlow:
    file: ../../subflows/toggle.yaml
    env:
      LIST: calendar-settings
      ID: calendar-assignment-sync
      ON: 'true'
- runFlow:
    file: ../../subflows/scroll-to-top.yaml
    env:
      LIST: calendar-settings
      ID: calendar-course-sync
- waitForAnimationToEnd
