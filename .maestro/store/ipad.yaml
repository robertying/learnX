appId: ${APP_ID}
name: App Store screenshots on the iPad
---
# Run by scripts/e2e/store-screenshots.sh (ipad): the iPad shots of the store
# listing, as STORE_OUT/NN-<slug>.png, in landscape. It turns after the
# login, which sets E2E_ORIENTATION (portrait by default). Details open
# beside the lists.
- runFlow: subflows/start.yaml
- setOrientation: LANDSCAPE_LEFT
- waitForAnimationToEnd

# 1 Today with the schedule open beside it
- runFlow: subflows/today.yaml
- tapOn:
    id: today-schedule
- extendedWaitUntil:
    visible:
      id: schedule
    timeout: 10000
- runFlow:
    file: ../subflows/screenshot.yaml
    env:
      NAME: 01-today

# 2 Notices with a notice open, another row's swipe actions and the filter
# menu open
- runFlow:
    file: ../subflows/tab.yaml
    env:
      TAB: 'tab-notices'
- runFlow:
    file: ../subflows/open.yaml
    env:
      CARD: '.*(${MOCK_STORE_NOTICE}).*'
      DETAIL: notice-detail
# Its body is a web view that renders after the screen shows.
- extendedWaitUntil:
    visible: '.*(${MOCK_STORE_NOTICE_BODY}).*'
    timeout: 15000
# On iPad a long press opens a context menu, which hides the filter button,
# and Maestro's element swipe is too short: swipe MOCK_STORE_SWIPE_NOTICE, the
# fifth row, by its position in the list pane.
- assertVisible: '.*(${MOCK_STORE_SWIPE_NOTICE}).*'
# Landscape has three columns; the list runs from about 20% to 43% of the
# width. Drag about a fifth of the row: farther runs the first action.
- swipe:
    start: 41%,64%
    end: 36%,64%
    duration: 800
- waitForAnimationToEnd
# Fail here, not in the shot, if the actions didn't open.
- assertVisible:
    id: card-fav
- tapOn: '${T_filter}'
- runFlow:
    file: ../subflows/screenshot.yaml
    env:
      NAME: 02-notices
- tapOn: '(${T_all})(, .*)?'
- waitForAnimationToEnd

# 3 All assignments with one open
- runFlow:
    file: ../subflows/tab.yaml
    env:
      TAB: 'tab-assignments'
- runFlow:
    file: ../subflows/filter.yaml
    env:
      LABEL: '(${T_all})(, .*)?'
- runFlow:
    file: ../subflows/open.yaml
    env:
      CARD: '.*(${MOCK_STORE_ASSIGNMENT}).*'
      DETAIL: assignment-detail
- runFlow:
    file: ../subflows/screenshot.yaml
    env:
      NAME: 03-assignments

# 4 Submitting it
- runFlow: subflows/submission.yaml
- runFlow:
    file: ../subflows/screenshot.yaml
    env:
      NAME: 04-submission

# 5 Files with a PDF open
- runFlow:
    file: ../subflows/tab.yaml
    env:
      TAB: 'tab-files'
- runFlow: subflows/file.yaml
- runFlow:
    file: ../subflows/screenshot.yaml
    env:
      NAME: 05-files

# 6 Courses with one open and another's swipe actions
- runFlow:
    file: ../subflows/tab.yaml
    env:
      TAB: 'tab-courses'
- runFlow:
    file: ../subflows/open.yaml
    env:
      CARD: '.*(${MOCK_STORE_COURSE}).*'
      DETAIL: course-detail
# The first row (MOCK_COURSE), swiped by its position as for notices, but
# to the right: Hide is a course's leading swipe action.
- assertVisible: '.*(${MOCK_COURSE}).*'
# A short drag from the middle of the row (a shorter one doesn't move it):
# farther runs Hide.
- swipe:
    start: 30%,19%
    end: 40%,19%
    duration: 800
- waitForAnimationToEnd
- assertVisible:
    id: card-hide
- runFlow:
    file: ../subflows/screenshot.yaml
    env:
      NAME: 06-courses

# 7 Search
- runFlow:
    file: ../subflows/tab.yaml
    env:
      TAB: 'tab-notices'
- runFlow:
    file: ../subflows/search.yaml
    env:
      TERM: ${STORE_SEARCH_TERM}
      RESULT: '.*(${MOCK_NOTICE}).*'
- pressKey: Enter
- runFlow:
    file: ../subflows/screenshot.yaml
    env:
      NAME: 07-search
- tapOn: '${T_close}'
- waitForAnimationToEnd

# 8 Settings with the notifications page open
- runFlow: subflows/notifications.yaml
- runFlow:
    file: ../subflows/screenshot.yaml
    env:
      NAME: 08-notifications
# Back to Today, where the calendar page's Settings opens from.
- runFlow:
    file: ../subflows/back.yaml
    env:
      LIST: '.*(${T_logout}).*'
- runFlow:
    file: ../subflows/back.yaml
    env:
      LIST: '.*(${T_todayDueSoon}).*'

# 9 Settings with the calendar page open
- runFlow: subflows/calendar.yaml
- runFlow:
    file: ../subflows/screenshot.yaml
    env:
      NAME: 09-calendar
