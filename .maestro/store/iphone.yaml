appId: ${APP_ID}
name: App Store screenshots on the iPhone
---
# Run by scripts/e2e/store-screenshots.sh (iphone): the iPhone shots
# of the store listing, as STORE_OUT/NN-<slug>.png.
- runFlow: subflows/start.yaml

# 1 Today and 2 Schedule
- runFlow: subflows/today.yaml
- runFlow:
    file: ../subflows/screenshot.yaml
    env:
      NAME: 01-today
- tapOn:
    id: today-schedule
- extendedWaitUntil:
    visible:
      id: schedule
    timeout: 10000
- runFlow:
    file: ../subflows/screenshot.yaml
    env:
      NAME: 02-schedule
- runFlow:
    file: ../subflows/back.yaml
    env:
      LIST: '.*(${T_todayDueSoon}).*'

# Notices, plain, for the search results asset
- runFlow:
    file: ../subflows/tab.yaml
    env:
      TAB: 'tab-notices'
- runFlow:
    file: ../subflows/screenshot.yaml
    env:
      NAME: 03-notices-plain

# 3 A row's swipe actions with the filter menu open
- runFlow:
    file: subflows/swipe-actions.yaml
    env:
      CARD: '.*(${MOCK_STORE_SWIPE_NOTICE}).*'
      DIRECTION: LEFT
- tapOn: '${T_filter}'
- runFlow:
    file: ../subflows/screenshot.yaml
    env:
      NAME: 03-notices-actions
# Closes the filter menu.
- tapOn: '(${T_all})(, .*)?'
- waitForAnimationToEnd

# 4 A notice with an attachment
- runFlow:
    file: ../subflows/open.yaml
    env:
      CARD: '.*(${MOCK_STORE_NOTICE}).*'
      DETAIL: notice-detail
# Its body is a web view that renders after the screen shows.
- extendedWaitUntil:
    visible: '.*(${MOCK_STORE_NOTICE_BODY}).*'
    timeout: 15000
- runFlow:
    file: ../subflows/screenshot.yaml
    env:
      NAME: 04-notice-detail
- runFlow:
    file: ../subflows/back.yaml
    env:
      LIST: '${T_filter}'

# 5 Assignments, all of them
- runFlow:
    file: ../subflows/tab.yaml
    env:
      TAB: 'tab-assignments'
- runFlow:
    file: ../subflows/filter.yaml
    env:
      LABEL: '(${T_all})(, .*)?'
- runFlow:
    file: ../subflows/screenshot.yaml
    env:
      NAME: 05-assignments

# 6 Files
- runFlow:
    file: ../subflows/tab.yaml
    env:
      TAB: 'tab-files'
- runFlow:
    file: ../subflows/screenshot.yaml
    env:
      NAME: 06-files

# 7 A PDF
- runFlow: subflows/file.yaml
- runFlow:
    file: ../subflows/screenshot.yaml
    env:
      NAME: 07-file
- runFlow:
    file: ../subflows/back.yaml
    env:
      LIST: '${T_filter}'

# 8 Courses, plain (for the search results asset) and with a row's swipe
# actions
- runFlow:
    file: ../subflows/tab.yaml
    env:
      TAB: 'tab-courses'
- runFlow:
    file: ../subflows/screenshot.yaml
    env:
      NAME: 08-courses-plain
- runFlow:
    file: subflows/swipe-actions.yaml
    env:
      CARD: '.*(${MOCK_COURSE}).*'
      DIRECTION: RIGHT
- runFlow:
    file: ../subflows/screenshot.yaml
    env:
      NAME: 08-courses

# 9 Search
- runFlow:
    file: ../subflows/tab.yaml
    env:
      TAB: 'tab-notices'
- runFlow:
    file: ../subflows/search.yaml
    env:
      TERM: ${STORE_SEARCH_TERM}
      RESULT: '.*(${MOCK_NOTICE}).*'
# The search key hides the keyboard.
- pressKey: Enter
- runFlow:
    file: ../subflows/screenshot.yaml
    env:
      NAME: 09-search
- tapOn: '${T_close}'
- waitForAnimationToEnd

# 10 Calendar settings
- runFlow: subflows/calendar.yaml
- runFlow:
    file: ../subflows/screenshot.yaml
    env:
      NAME: 10-calendar
