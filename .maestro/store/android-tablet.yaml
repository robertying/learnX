appId: ${APP_ID}
name: Google Play screenshots on an Android tablet
---
# Run by scripts/e2e/store-screenshots.sh (android-tablet): the tablet shots of
# the Play listing, as STORE_OUT/NN-<slug>.png. Details open beside the
# lists.
- runFlow: subflows/start.yaml

# 1 Today with the schedule open beside it
- runFlow: subflows/today.yaml
- tapOn:
    id: today-schedule
- extendedWaitUntil:
    visible:
      id: schedule
    timeout: 10000
- runFlow:
    file: ../subflows/screenshot.yaml
    env:
      NAME: 01-today

# 2 Notices with a notice open and the filter menu open
- runFlow:
    file: ../subflows/tab.yaml
    env:
      TAB: 'tab-notices'
- runFlow:
    file: ../subflows/open.yaml
    env:
      CARD: '.*(${MOCK_STORE_NOTICE}).*'
      DETAIL: notice-detail
# Its body is a web view that renders after the screen shows.
- extendedWaitUntil:
    visible: '.*(${MOCK_STORE_NOTICE_BODY}).*'
    timeout: 15000
# The filter menu open. Android's swipe actions run on release and leave
# nothing showing, so no card shows its actions.
- tapOn: '${T_filter}'
- runFlow:
    file: ../subflows/screenshot.yaml
    env:
      NAME: 02-notices
- tapOn: '(${T_all})(, .*)?'
- waitForAnimationToEnd

# 3 All assignments with one open
- runFlow:
    file: ../subflows/tab.yaml
    env:
      TAB: 'tab-assignments'
- runFlow:
    file: ../subflows/filter.yaml
    env:
      LABEL: '(${T_all})(, .*)?'
# Its card is below the list pane's end, and the notice open beside the list
# has the same title: match the card by its label (the title, then a comma)
# and scroll the list pane itself (scrollUntilVisible swipes the middle of
# the screen, which is the detail pane).
- repeat:
    times: 4
    while:
      notVisible: '(.*, )?(${MOCK_STORE_ASSIGNMENT}), .*'
    commands:
      - swipe:
          start: 4%,75%
          end: 4%,35%
          duration: 600
      - waitForAnimationToEnd
- runFlow:
    file: ../subflows/open.yaml
    env:
      CARD: '(.*, )?(${MOCK_STORE_ASSIGNMENT}), .*'
      DETAIL: assignment-detail
- runFlow:
    file: ../subflows/screenshot.yaml
    env:
      NAME: 03-assignments

# 4 Submitting it
- runFlow: subflows/submission.yaml
- runFlow:
    file: ../subflows/screenshot.yaml
    env:
      NAME: 04-submission

# 5 Files with a PDF open
- runFlow:
    file: ../subflows/tab.yaml
    env:
      TAB: 'tab-files'
- runFlow: subflows/file.yaml
- runFlow:
    file: ../subflows/screenshot.yaml
    env:
      NAME: 05-file

# 6 Courses with one open
- runFlow:
    file: ../subflows/tab.yaml
    env:
      TAB: 'tab-courses'
- runFlow:
    file: ../subflows/open.yaml
    env:
      CARD: '.*(${MOCK_STORE_COURSE}).*'
      DETAIL: course-detail
- runFlow:
    file: ../subflows/screenshot.yaml
    env:
      NAME: 06-courses

# 7 Search
- runFlow:
    file: ../subflows/tab.yaml
    env:
      TAB: 'tab-notices'
- runFlow:
    file: ../subflows/search.yaml
    env:
      TERM: ${STORE_SEARCH_TERM}
      RESULT: '.*(${MOCK_NOTICE}).*'
# Hides the keyboard; Maestro's hideKeyboard is the back key, which clears
# the query.
- pressKey: Escape
- waitForAnimationToEnd
- runFlow:
    file: ../subflows/screenshot.yaml
    env:
      NAME: 07-search
# The first back clears the query and brings the keyboard back: go back
# until search is closed, or Settings below would match Gboard's gear.
- back
- waitForAnimationToEnd
- repeat:
    times: 3
    while:
      visible: '${T_searchPrompt}'
    commands:
      - back
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: tab-notices
    timeout: 10000

# 8 Settings with the calendar page open
- runFlow: subflows/calendar.yaml
- runFlow:
    file: ../subflows/screenshot.yaml
    env:
      NAME: 08-calendar
