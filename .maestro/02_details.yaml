appId: ${APP_ID}
name: Open a notice, an assignment and a file
---
- runFlow: subflows/login.yaml

- tapOn: '.*(${MOCK_NOTICE}).*'
- extendedWaitUntil:
    visible:
      id: notice-detail
    timeout: 10000
- runFlow:
    file: subflows/back.yaml
    env:
      LIST: '${T_filter}'

- runFlow:
    file: subflows/tab.yaml
    env:
      TAB: 'tab-assignments|list\.bullet\.clipboard\.fill'
- tapOn: '.*(${MOCK_ASSIGNMENT}).*'
- extendedWaitUntil:
    visible:
      id: assignment-detail
    timeout: 10000
- assertVisible: '.*(${MOCK_ASSIGNMENT_ATTACHMENT}).*'
- runFlow:
    file: subflows/back.yaml
    env:
      LIST: '${T_filter}'

- runFlow:
    file: subflows/tab.yaml
    env:
      TAB: 'tab-files|folder\.fill'
- tapOn: '.*(${MOCK_FILE}).*'
# The screen shows right away; the file itself downloads in the background.
- extendedWaitUntil:
    visible:
      id: file-detail
    timeout: 10000
- runFlow:
    file: subflows/back.yaml
    env:
      LIST: '${T_filter}'
