appId: ${APP_ID}
name: Open a notice, an assignment and a file
---
- runFlow: subflows/login.yaml

- runFlow:
    file: subflows/open.yaml
    env:
      CARD: '.*(${MOCK_NOTICE}).*'
      DETAIL: notice-detail
- runFlow:
    file: subflows/back.yaml
    env:
      LIST: '${T_filter}'

- runFlow:
    file: subflows/tab.yaml
    env:
      TAB: 'tab-assignments|list\.bullet\.clipboard\.fill'
- runFlow:
    file: subflows/open.yaml
    env:
      CARD: '.*(${MOCK_ASSIGNMENT}).*'
      DETAIL: assignment-detail
- assertVisible: '.*(${MOCK_ASSIGNMENT_ATTACHMENT}).*'
- runFlow:
    file: subflows/back.yaml
    env:
      LIST: '${T_filter}'

- runFlow:
    file: subflows/tab.yaml
    env:
      TAB: 'tab-files|folder\.fill'
# The screen shows right away; the file itself downloads in the background.
- runFlow:
    file: subflows/open.yaml
    env:
      CARD: '.*(${MOCK_FILE}).*'
      DETAIL: file-detail
- runFlow:
    file: subflows/back.yaml
    env:
      LIST: '${T_filter}'
