appId: ${APP_ID}
name: Favorite and archive a notice
---
# Checks the outcome of each action, not its toast: on iOS the Liquid Glass
# toast keeps the screen from settling, so Maestro's settle wait outlasts a
# 3 s toast. Toasts are covered by Jest (components/__tests__/Toast.test.tsx).
- runFlow: subflows/login.yaml

# Favorite
- runFlow:
    file: subflows/card_actions.yaml
    env:
      CARD: '.*请按照助教的安排交作业.*'
- tapOn:
    id: card-fav
- runFlow:
    file: subflows/filter.yaml
    env:
      LABEL: 'Favorites(, .*)?|收藏(, .*)?'
- assertVisible: '.*请按照助教的安排交作业.*'

# Unfavorite from the favorites list
- runFlow:
    file: subflows/card_actions.yaml
    env:
      CARD: '.*请按照助教的安排交作业.*'
- tapOn:
    id: card-fav
- assertNotVisible: '.*请按照助教的安排交作业.*'

# Archive from the full list
- runFlow:
    file: subflows/filter.yaml
    env:
      LABEL: 'All(, .*)?|全部(, .*)?'
- runFlow:
    file: subflows/card_actions.yaml
    env:
      CARD: '.*请按照助教的安排交作业.*'
- tapOn:
    id: card-archive
- assertNotVisible: '.*请按照助教的安排交作业.*'
- runFlow:
    file: subflows/filter.yaml
    env:
      LABEL: 'Archived(, .*)?|归档(, .*)?'
- assertVisible: '.*请按照助教的安排交作业.*'

# Restore it
- runFlow:
    file: subflows/card_actions.yaml
    env:
      CARD: '.*请按照助教的安排交作业.*'
- tapOn:
    id: card-archive
- runFlow:
    file: subflows/filter.yaml
    env:
      LABEL: 'All(, .*)?|全部(, .*)?'
- assertVisible: '.*请按照助教的安排交作业.*'
