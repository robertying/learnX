appId: ${APP_ID}
name: Favorite and archive a notice
---
- runFlow: subflows/login.yaml

# Favorite
- runFlow:
    file: subflows/card_actions.yaml
    env:
      CARD: '.*请按照助教的安排交作业.*'
- tapOn:
    id: card-fav
    # The toast only stays up for 3 s; don't spend it waiting to settle.
    waitToSettleTimeoutMs: 500
- assertVisible: 'Added to Favorites|已添加到收藏'
- runFlow:
    file: subflows/filter.yaml
    env:
      FILTER: fav
- assertVisible: '.*请按照助教的安排交作业.*'

# Unfavorite from the favorites list
- runFlow:
    file: subflows/card_actions.yaml
    env:
      CARD: '.*请按照助教的安排交作业.*'
- tapOn:
    id: card-fav
    # The toast only stays up for 3 s; don't spend it waiting to settle.
    waitToSettleTimeoutMs: 500
- assertVisible: 'Removed from Favorites|已从收藏移除'
- assertNotVisible: '.*请按照助教的安排交作业.*'

# Archive from the full list
- runFlow:
    file: subflows/filter.yaml
    env:
      FILTER: all
- runFlow:
    file: subflows/card_actions.yaml
    env:
      CARD: '.*请按照助教的安排交作业.*'
- tapOn:
    id: card-archive
    waitToSettleTimeoutMs: 500
- assertVisible: 'Archived|已归档'
- assertNotVisible: '.*请按照助教的安排交作业.*'
- runFlow:
    file: subflows/filter.yaml
    env:
      FILTER: archived
- assertVisible: '.*请按照助教的安排交作业.*'

# Restore it
- runFlow:
    file: subflows/card_actions.yaml
    env:
      CARD: '.*请按照助教的安排交作业.*'
- tapOn:
    id: card-archive
    waitToSettleTimeoutMs: 500
- assertVisible: 'Undo archiving|已撤销归档'
- runFlow:
    file: subflows/filter.yaml
    env:
      FILTER: all
- assertVisible: '.*请按照助教的安排交作业.*'
