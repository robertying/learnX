appId: ${APP_ID}
name: Open settings pages and log out
---
- runFlow: subflows/login.yaml
- runFlow: subflows/settings.yaml
# Changelog first: on iPad the page it opens beside the list is a web view,
# which keeps the logout alert out of Maestro's snapshot.
- tapOn: '.*(${T_changelog}).*'
- runFlow:
    file: subflows/back.yaml
    env:
      LIST: '.*(${T_logout}).*'
# Settings is a native lazy list, and on phones About is near the bottom,
# under the floating tab bar: scroll it to the middle first.
- runFlow:
    when:
      platform: iOS
    commands:
      - scrollUntilVisible:
          element: '.*(${T_about}).*'
          direction: DOWN
          centerElement: true
# scrollUntilVisible swipes the middle of the screen, which is the detail
# pane on an unfolded foldable or tablet: swipe the Settings list itself.
- runFlow:
    when:
      platform: Android
    commands:
      - repeat:
          times: 8
          while:
            notVisible: '.*(${T_about}).*'
          commands:
            - swipe:
                from:
                  id: settings-list
                direction: UP
- tapOn: '.*(${T_about}).*'
- assertVisible: '.*© \d+ Rui Ying.*'
- runFlow:
    file: subflows/back.yaml
    env:
      # Not About: the About page's title matches that too.
      LIST: '.*(${T_helpAndFeedback}).*'
- runFlow:
    when:
      platform: iOS
    commands:
      - scrollUntilVisible:
          element:
            id: settings-logout
          direction: UP
          centerElement: true
- runFlow:
    when:
      platform: Android
    commands:
      - repeat:
          times: 8
          while:
            notVisible:
              id: settings-logout
          commands:
            - swipe:
                from:
                  id: settings-list
                direction: DOWN

- tapOn:
    id: settings-logout
# The alert's button repeats the Settings row's label. On iOS the alert comes
# after the list in the snapshot; on Android the dialog hides the list.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: '${T_logout}'
          index: 1
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: 'android:id/button1'
- extendedWaitUntil:
    visible:
      # After a logout iOS may drop the field's own identifier from the
      # snapshot; TextField's label keeps a derived one.
      id: 'login-username(-label)?'
    timeout: 10000
