appId: ${APP_ID}
name: Open settings pages and log out
---
- runFlow: subflows/login.yaml
- runFlow: subflows/settings.yaml
# Changelog first: on iPad the page it opens beside the list is a web view,
# which keeps the logout alert out of Maestro's snapshot.
- tapOn: '.*(Changelog|更新日志).*'
- runFlow:
    file: subflows/back.yaml
    env:
      LIST: '.*(Log Out|退出登录).*'
# Settings is a native lazy list, and on phones About is near the bottom,
# under the floating tab bar: scroll it to the middle first.
- runFlow:
    when:
      platform: iOS
    commands:
      - scrollUntilVisible:
          element: '.*(About|关于).*'
          direction: DOWN
          centerElement: true
# scrollUntilVisible swipes the middle of the screen, which is the detail
# pane on an unfolded foldable or tablet: swipe the Settings list itself.
- runFlow:
    when:
      platform: Android
    commands:
      - repeat:
          times: 8
          while:
            notVisible: '.*(About|关于).*'
          commands:
            - swipe:
                from:
                  id: settings-list
                direction: UP
- tapOn: '.*(About|关于).*'
- assertVisible: '.*© \d+ Rui Ying.*'
- runFlow:
    file: subflows/back.yaml
    env:
      # Not About: the About page's title matches that too.
      LIST: '.*(Help & Feedback|帮助与反馈).*'
- runFlow:
    when:
      platform: iOS
    commands:
      - scrollUntilVisible:
          element:
            id: settings-logout
          direction: UP
          centerElement: true
- runFlow:
    when:
      platform: Android
    commands:
      - repeat:
          times: 8
          while:
            notVisible:
              id: settings-logout
          commands:
            - swipe:
                from:
                  id: settings-list
                direction: DOWN

- tapOn:
    id: settings-logout
# The alert's button repeats the Settings row's label; the alert comes
# after the list in the snapshot.
- tapOn:
    text: 'Log Out|退出登录'
    index: 1
- extendedWaitUntil:
    visible:
      # After a logout iOS may drop the field's own identifier from the
      # snapshot; TextField's label keeps a derived one.
      id: 'login-username(-label)?'
    timeout: 10000
