appId: ${APP_ID}
name: Open a notice, an assignment and a file
# Live runs (scripts/e2e/e2e.sh --live) open the first item of each list instead,
# so the account needs a notice, an assignment and a file this semester.
tags:
  - live
---
- runFlow: subflows/login.yaml

- runFlow:
    file: subflows/open.yaml
    env:
      CARD: '.*(${MOCK_NOTICE}).*'
      CARD_ID: notice-card
      DETAIL: notice-detail
- runFlow:
    file: subflows/back.yaml
    env:
      LIST: '${T_filter}'

- runFlow:
    file: subflows/tab.yaml
    env:
      TAB: 'tab-assignments'
- runFlow:
    file: subflows/open.yaml
    env:
      CARD: '.*(${MOCK_ASSIGNMENT}).*'
      CARD_ID: assignment-card
      DETAIL: assignment-detail
- runFlow:
    when:
      true: ${ACCOUNT == 'mock'}
    commands:
      # Below the description, past the bottom of a short screen (the closed
      # iPhone Duo). The detail itself is swiped: the middle of the screen
      # can be the list in the split layout.
      - runFlow:
          file: subflows/scroll-list.yaml
          env:
            LIST: assignment-detail
            TARGET: '.*(${MOCK_ASSIGNMENT_ATTACHMENT}).*'
            DIRECTION: UP
- runFlow:
    file: subflows/back.yaml
    env:
      LIST: '${T_filter}'

- runFlow:
    file: subflows/tab.yaml
    env:
      TAB: 'tab-files'
# The screen shows right away; the file itself downloads in the background.
- runFlow:
    file: subflows/open.yaml
    env:
      CARD: '.*(${MOCK_FILE}).*'
      CARD_ID: file-card
      DETAIL: file-detail
- runFlow:
    file: subflows/back.yaml
    env:
      LIST: '${T_filter}'
