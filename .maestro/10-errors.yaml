appId: ${APP_ID}
name: Show no results and failures
---
- runFlow: subflows/login.yaml

# Nothing found: a search for text no item has
- runFlow:
    file: subflows/search.yaml
    env:
      TERM: zzzqqq
      RESULT: '${T_noResults}'
- assertVisible: '${T_noResultsDescription}'
- runFlow:
    file: subflows/shot.yaml
    env:
      NAME: no-results
# On Android the keyboard is still up: the first back hides it, the next
# closes search. Maestro's hideKeyboard can't tell when Gboard's split
# keyboard (an unfolded foldable) has gone, so go back until search has.
- runFlow:
    when:
      platform: Android
    commands:
      - repeat:
          times: 3
          while:
            visible:
              id: search-tabs
          commands:
            - back
- runFlow:
    when:
      platform: iOS
    commands:
      - runFlow: subflows/close.yaml

# Offline: the mockFailure launch argument makes the emulated server fail
# every request. The lists keep what they had and say they're offline.
- launchApp:
    stopApp: true
    arguments:
      mockLatency: none
      mockFailure: offline
- extendedWaitUntil:
    visible: '.*(${T_syncStatusOffline}).*'
    timeout: 30000
- runFlow:
    file: subflows/shot.yaml
    env:
      NAME: offline
# A file that isn't on the device can't download (08 deleted file 1's).
- runFlow:
    file: subflows/tab.yaml
    env:
      TAB: 'tab-files'
- runFlow:
    file: subflows/open.yaml
    env:
      CARD: '.*(${MOCK_FILE}).*'
      DETAIL: file-detail
- extendedWaitUntil:
    visible:
      id: file-error
    timeout: 30000
- runFlow:
    file: subflows/shot.yaml
    env:
      NAME: file-error
- tapOn: '${T_tryAgain}'
- extendedWaitUntil:
    visible:
      id: file-error
    timeout: 30000
- runFlow:
    file: subflows/back.yaml
    env:
      LIST: '${T_filter}'

# A server that answers with errors: the login fails after its quick retries,
# and the lists say so. It tries again by itself later (helpers/loginRetry),
# so there's no Log In button.
- launchApp:
    stopApp: true
    arguments:
      mockLatency: none
      mockFailure: serverError
- extendedWaitUntil:
    visible: '.*(${T_syncStatusServerError}).*'
    timeout: 30000
- assertNotVisible:
    id: sync-status-relogin
- runFlow:
    file: subflows/shot.yaml
    env:
      NAME: server-error

# A device the SSO server no longer trusts (its fingerprint expired): the
# lists say so and offer to log in again, which goes through SSO's second
# factor.
- launchApp:
    stopApp: true
    arguments:
      mockLatency: none
      mockFailure: untrustedDevice
- extendedWaitUntil:
    visible: '.*(${T_syncStatusUntrustedDevice}).*'
    timeout: 30000
- assertVisible:
    id: sync-status-relogin

# A server that doesn't answer: the login times out (the mock server's 20 s
# timeout) and counts as offline, then tries again on its own (30 s,
# helpers/loginRetry), reconnecting meanwhile. Both waits are scaled down to a
# fifth (quickTimeout): 4 s, then 6 s.
- launchApp:
    stopApp: true
    arguments:
      mockLatency: none
      mockFailure: quickTimeout
- extendedWaitUntil:
    visible: '.*(${T_syncStatusOffline}).*'
    timeout: 20000
# Maestro counts this timeout from the last interaction (the launch above),
# not from the wait before it (adjustedToLatestInteraction in Orchestra.kt).
- extendedWaitUntil:
    visible: '.*(${T_syncStatusReconnecting}).*'
    timeout: 30000

# A password changed on the website while the app is open: the session runs
# out after the launch login (mockSessionExpiry), and the login the next
# request starts is turned down, so the lists say the login failed and offer
# to log in again, whichever request found it.
- launchApp:
    stopApp: true
    arguments:
      mockLatency: none
      mockFailure: none
      mockSessionExpiry: passwordChanged
- extendedWaitUntil:
    visible:
      id: sync-status-relogin
    timeout: 30000
- assertVisible: '.*(${T_syncStatusBadCredential}).*'

# A saved login the server turns down, as after a password change: the
# launch login and the next one are rejected (mockLoginFails), the third
# goes through. Back online for the flows after this one.
- launchApp:
    stopApp: true
    arguments:
      mockLatency: none
      mockFailure: none
      mockLoginFails: '2'
- extendedWaitUntil:
    visible:
      id: sync-status-relogin
    timeout: 30000
- assertVisible: '.*(${T_syncStatusBadCredential}).*'
- runFlow:
    file: subflows/shot.yaml
    env:
      NAME: login-rejected
# Log In opens the login page with the saved account, but not its turned-down
# password, and without logging in with the saved account again, which would
# only be turned down too.
- tapOn:
    id: sync-status-relogin
- extendedWaitUntil:
    visible:
      id: login-username
    timeout: 10000
- assertNotVisible: '${T_retryLogin}'
# A password typed here that's turned down too: the page stays, saying why.
- tapOn:
    id: login-password
- inputText: ${PASSWORD}
- pressKey: Enter
- extendedWaitUntil:
    visible: 'bad credential(.|\n)*'
    timeout: 30000
- assertVisible:
    id: login-username
# The failure's toast can sit over the buttons below (the closed iPhone Duo's
# short screen): wait for it to go, as a person would.
- extendedWaitUntil:
    notVisible: 'bad credential(.|\n)*'
    timeout: 10000
# Continue Offline goes back to the saved data, still offering to log in.
- tapOn: '${T_offlineMode}'
# Leaving the login page after a typed password, some iOS devices ask to save
# it (the system's own labels), which hides the app until dismissed.
- tapOn:
    text: 'Not Now|现在不|以后'
    optional: true
- extendedWaitUntil:
    visible:
      id: sync-status-relogin
    timeout: 10000
# The third login goes through: the login page and the status go away. The
# page starts without the turned-down password again, so it's typed again.
- tapOn:
    id: sync-status-relogin
- extendedWaitUntil:
    visible:
      id: login-password
    timeout: 10000
- tapOn:
    id: login-password
- inputText: ${PASSWORD}
- pressKey: Enter
# Some iOS devices ask to save the password first (the system's own labels).
- tapOn:
    text: 'Not Now|现在不|以后'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'tab-notices'
    timeout: 30000
- assertNotVisible:
    id: login-username
- extendedWaitUntil:
    notVisible:
      id: sync-status-relogin
    timeout: 10000
