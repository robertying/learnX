appId: ${APP_ID}
name: Show no results and failures
---
- runFlow: subflows/login.yaml

# Nothing found: a search for text no item has
- runFlow:
    file: subflows/search.yaml
    env:
      TERM: zzzqqq
      RESULT: '${T_noResults}'
- assertVisible: '${T_noResultsDescription}'
- runFlow:
    file: subflows/shot.yaml
    env:
      NAME: no-results
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow: subflows/close.yaml

# Offline: the mockFailure launch argument makes the emulated server fail
# every request. The lists keep what they had and say they're offline.
- launchApp:
    stopApp: true
    arguments:
      mockLatency: none
      mockFailure: offline
- extendedWaitUntil:
    visible: '.*(${T_syncStatusOffline}).*'
    timeout: 30000
- runFlow:
    file: subflows/shot.yaml
    env:
      NAME: offline
# A file that isn't on the device can't download (08 deleted file 1's).
- runFlow:
    file: subflows/tab.yaml
    env:
      TAB: 'tab-files|folder\.fill'
- runFlow:
    file: subflows/open.yaml
    env:
      CARD: '.*(${MOCK_FILE}).*'
      DETAIL: file-detail
- extendedWaitUntil:
    visible:
      id: file-error
    timeout: 30000
- runFlow:
    file: subflows/shot.yaml
    env:
      NAME: file-error
- tapOn: '${T_tryAgain}'
- extendedWaitUntil:
    visible:
      id: file-error
    timeout: 30000
- runFlow:
    file: subflows/back.yaml
    env:
      LIST: '${T_filter}'

# A server that answers with errors: the login fails after its retries, and
# the lists say so and offer to log in again.
- launchApp:
    stopApp: true
    arguments:
      mockLatency: none
      mockFailure: serverError
- extendedWaitUntil:
    visible: '.*(${T_syncStatusLoginFailed}).*'
    timeout: 30000
- assertVisible:
    id: sync-status-relogin
- runFlow:
    file: subflows/shot.yaml
    env:
      NAME: server-error

# A server that doesn't answer: the login times out after 20 s (the mock
# server's timeout) and counts as offline, then tries again on its own after
# 30 s (helpers/loginRetry), reconnecting meanwhile.
- launchApp:
    stopApp: true
    arguments:
      mockLatency: none
      mockFailure: timeout
- extendedWaitUntil:
    visible: '.*(${T_syncStatusOffline}).*'
    timeout: 40000
# Maestro counts this timeout from the last interaction (the launch above),
# not from the wait before it (adjustedToLatestInteraction in Orchestra.kt):
# the app retries 30 s after going offline (20 s timeout), about 50 s in.
- extendedWaitUntil:
    visible: '.*(${T_syncStatusReconnecting}).*'
    timeout: 75000

# A password changed on the website while the app is open: the session runs
# out after the launch login (mockSessionExpiry), and the login the next
# request starts is turned down, so the lists say the login failed and offer
# to log in again, whichever request found it.
- launchApp:
    stopApp: true
    arguments:
      mockLatency: none
      mockFailure: none
      mockSessionExpiry: passwordChanged
- extendedWaitUntil:
    visible:
      id: sync-status-relogin
    timeout: 30000
- assertVisible: '.*(${T_syncStatusLoginFailed}).*'

# A saved login the server turns down, as after a password change: the
# launch login and the next one are rejected (mockLoginFails), the third
# goes through. Back online for the flows after this one.
- launchApp:
    stopApp: true
    arguments:
      mockLatency: none
      mockFailure: none
      mockLoginFails: '2'
- extendedWaitUntil:
    visible:
      id: sync-status-relogin
    timeout: 30000
- assertVisible: '.*(${T_syncStatusLoginFailed}).*'
- runFlow:
    file: subflows/shot.yaml
    env:
      NAME: login-rejected
# Log In opens the login page with the saved account filled in.
- tapOn:
    id: sync-status-relogin
- extendedWaitUntil:
    visible:
      id: login-username
    timeout: 10000
- assertVisible: '${T_retryLogin}'
# Its second login is rejected too: the page stays, saying why.
- tapOn: '${T_retryLogin}'
- extendedWaitUntil:
    visible: 'bad credential(.|\n)*'
    timeout: 30000
- assertVisible:
    id: login-username
# Continue Offline goes back to the saved data, still offering to log in.
- tapOn: '${T_offlineMode}'
- extendedWaitUntil:
    visible:
      id: sync-status-relogin
    timeout: 10000
# The third login goes through: the login page and the status go away.
- tapOn:
    id: sync-status-relogin
- extendedWaitUntil:
    visible: '${T_retryLogin}'
    timeout: 10000
- tapOn: '${T_retryLogin}'
- extendedWaitUntil:
    visible:
      id: 'tab-notices|bell\.fill'
    timeout: 30000
- assertNotVisible:
    id: login-username
- extendedWaitUntil:
    notVisible:
      id: sync-status-relogin
    timeout: 10000
