appId: ${APP_ID}
name: Refuse a badly signed over-the-air update, apply a good one, roll back
# Run by scripts/e2e-ota.sh, which starts the update server; not part of the
# normal runs. E2E builds ask it for updates (scripts/ota-config-ios.sh,
# android/app/build.gradle). The native side checks on each launch and
# downloads in the background, so an update runs from the launch after the
# one that downloaded it.
---
- runFlow: ../subflows/reset.yaml
- runScript:
    file: server.js
    env:
      PATH_: /mode/none
- runFlow: ../subflows/login.yaml

# An update the app's certificate doesn't verify is refused: nothing is
# downloaded and the built-in bundle keeps running.
- runScript:
    file: server.js
    env:
      PATH_: /mode/badsig
- evalScript: ${output.manifestsBefore = output.ota.manifestRequests}
- evalScript: ${output.bundlesBefore = output.ota.bundleDownloads}
- runFlow: ../subflows/login.yaml
- runScript:
    file: server.js
    env:
      PATH_: /wait?for=manifest&after=${output.manifestsBefore}
- runFlow: ../subflows/login.yaml
- runFlow: about.yaml
- assertVisible: '.*\d+\.\d+\.\d+ \(\d+\)'
- assertNotVisible: '.*· ${output.ota.short}.*'
- assertTrue: ${output.ota.bundleDownloads == output.bundlesBefore}

# A new update: downloaded on one launch, running from the next.
- runScript:
    file: server.js
    env:
      PATH_: /mode/update
- evalScript: ${output.bundlesBefore = output.ota.bundleDownloads}
- runFlow: ../subflows/login.yaml
- runScript:
    file: server.js
    env:
      PATH_: /wait?for=bundle&after=${output.bundlesBefore}
- assertTrue: ${output.ota.bundleDownloads > output.bundlesBefore}
- runFlow: ../subflows/login.yaml
- runFlow: about.yaml
- assertVisible: '.*\d+\.\d+\.\d+ \(\d+\) · ${output.ota.short}'

# Rolling back: the launch after the one that got the directive runs the
# bundle built into the app again.
- runScript:
    file: server.js
    env:
      PATH_: /mode/rollback
- evalScript: ${output.manifestsBefore = output.ota.manifestRequests}
- runFlow: ../subflows/login.yaml
- runScript:
    file: server.js
    env:
      PATH_: /wait?for=manifest&after=${output.manifestsBefore}
- runFlow: ../subflows/login.yaml
- runFlow: about.yaml
- assertVisible: '.*\d+\.\d+\.\d+ \(\d+\)'
- assertNotVisible: '.*· ${output.ota.short}.*'
