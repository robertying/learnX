import com.android.build.api.variant.FilterConfiguration
import groovy.json.JsonSlurper

// Over-the-air updates: the URL, request headers (channel and Expo project id)
// and runtime version from app.json and the certificate from
// certs/ota-certificate.pem, as string
// resources the manifest's expo.modules.updates meta-data reads. iOS does the
// same in scripts/xcode/ota-config-ios.sh. E2E builds (-PciRelease) get the local
// test server (scripts/e2e/ota-e2e-server.mjs, through `adb reverse`), runtime
// version "e2e" and the test certificate from scripts/e2e/ota-e2e-cert.sh, so they
// never load a published update.
def otaConfig(boolean e2e) {
    def root = rootProject.file("..")
    def appJson = new JsonSlurper().parse(new File(root, "app.json"))
    def url = e2e ? "http://localhost:8199/manifest" : appJson.updates.url
    def headers = e2e ? ["expo-channel-name": "production"] : appJson.updates.requestHeaders
    def certificate = e2e ? new File(root, "build/ota-e2e/certificate.pem") : new File(root, "certs/ota-certificate.pem")
    if (!certificate.exists()) {
        throw new GradleException("${certificate} is missing; for an E2E build, run scripts/e2e/ota-e2e-cert.sh first.")
    }
    return [
        strings: [
            expo_updates_url: url,
            expo_runtime_version: e2e ? "e2e" : appJson.runtimeVersion,
            // A string resource keeps quotes and line breaks only escaped.
            expo_updates_request_headers: groovy.json.JsonOutput.toJson(headers).replace('"', '\\"'),
            expo_updates_certificate: certificate.text.trim().replace("\n", "\\n"),
        ],
    ]
}

def applyOtaConfig(variant, boolean e2e) {
    def config = otaConfig(e2e)
    config.strings.each { name, value -> variant.resValue "string", name, value }
}

plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "com.facebook.react"
    id "com.google.gms.google-services"
    id "com.google.firebase.crashlytics"
}

react {
    autolinkLibrariesWithApp()
    // Bundles with `expo export:embed`, as over-the-air updates are made with
    // `expo export`.
    cliFile = new File(providers.exec {
        workingDir(rootDir)
        commandLine("node", "--print", "require.resolve('@expo/cli', { paths: [require.resolve('expo/package.json')] })")
    }.standardOutput.asText.get().trim())
    bundleCommand = "export:embed"
    // Debug builds of both distributions load JS from Metro.
    debuggableVariants = ["googlePlayDebug", "githubDebug"]
}

// The ABIs the app is built for, and the others, whose native libraries
// stay out of every APK and bundle (packaging below).
def builtAbis = project.property("reactNativeArchitectures").split(",")*.trim()
def otherAbis = ["armeabi", "armeabi-v7a", "arm64-v8a", "x86", "x86_64", "riscv64", "mips", "mips64"] - builtAbis

// The compile SDK, build tools, NDK, CMake, Java and Kotlin JVM settings come from the root
// build.gradle, which sets them for every project.
android {
    namespace = "io.robertying.learnx"

    defaultConfig {
        applicationId = "io.robertying.learnx"
        minSdk = rootProject.ext.minSdkVersion
        targetSdk = rootProject.ext.targetSdkVersion
        versionCode = 9204560
        versionName = "19.2.0"
        // A release build's number, which is never committed: fastlane's build
        // lanes pass -PlearnxBuildNumber=<n> (the Xcode builds get the same n).
        def releaseBuild = findProperty("learnxBuildNumber")
        if (releaseBuild) {
            versionCode = 9_200_000 + (releaseBuild as int)
        }
        // A newer build of the same app for scripts/e2e/e2e-updater.sh to update
        // to: -Pe2eVersion=99.0.<n> names it so and raises the version code
        // by n + 1.
        def e2eVersion = findProperty("e2eVersion")
        if (e2eVersion) {
            versionCode = versionCode + 1 + (e2eVersion.tokenize(".").last() as int)
            versionName = e2eVersion
        }
        applyOtaConfig(delegate, false)
    }

    // Where a build is published. googlePlay: the AAB for Google Play, which
    // updates the app itself. github: the APKs on GitHub Releases and the TUNA
    // mirror, which update themselves in the app (modules/updater); only they
    // may install packages (src/github/AndroidManifest.xml), which Google Play
    // doesn't allow. Both are the same app otherwise.
    flavorDimensions = ["distribution"]
    productFlavors {
        googlePlay {
            dimension = "distribution"
        }
        github {
            dimension = "distribution"
        }
    }

    androidResources {
        // Chinese strings are Simplified (values-zh); values-b+zh+Hant repeats
        // them for Traditional Chinese, which would fall back to English.
        // Libraries keep theirs by region (Material 3's date picker, the
        // system's OK and Cancel), which a bare "zh" leaves out.
        localeFilters += ["en", "zh", "zh-rCN", "zh-rHK", "zh-rTW", "b+zh+Hant"]
    }

    splits {
        abi {
            reset()
            // Off when building an AAB: Google Play splits it by ABI itself, and
            // AGP can't shrink resources for a bundle while ABI splits are on
            // (https://issuetracker.google.com/402800800). Gradle can't enable
            // splits per variant, so build bundles and APKs in separate runs.
            enable = !gradle.startParameter.taskNames.any { it ==~ /(.*:)?bundle[A-Z].*/ }
            universalApk = true
            // Follows reactNativeArchitectures, so CI can build a single ABI
            include(*project.property("reactNativeArchitectures").split(","))
        }
    }

    // Native libraries for the ABIs the app isn't built for stay out of every
    // APK and bundle. Prebuilt libraries (React Native's, Hermes, pdfium,
    // Crashlytics) also ship x86, which the universal APK took (23 MB),
    // though the app's own libraries aren't built for it, so it couldn't run
    // there. ndk.abiFilters would do the same but AGP refuses it beside ABI
    // splits. React Native's own libraries are also picked first for every
    // ABI, which wins over an exclude: onVariants below narrows that.
    packaging {
        jniLibs {
            excludes.addAll(otherAbis.collect { "lib/${it}/**".toString() })
        }
    }

    signingConfigs {
        debug {
            storeFile = file("debug.keystore")
            storePassword = "android"
            keyAlias = "androiddebugkey"
            keyPassword = "android"
        }

        // Release signing values; see android/local.properties.example. Without
        // the file, debug builds still work and release builds fail to sign.
        Properties properties = new Properties()
        def localProperties = project.rootProject.file("local.properties")
        if (localProperties.exists()) {
            localProperties.withInputStream { properties.load(it) }
        }

        release {
            storeFile = file("release.keystore")
            storePassword = properties.getProperty("LEARNX_RELEASE_STORE_PASSWORD")
            keyAlias = properties.getProperty("LEARNX_RELEASE_KEY_ALIAS")
            keyPassword = properties.getProperty("LEARNX_RELEASE_KEY_PASSWORD")
        }
    }

    buildTypes {
        debug {
            signingConfig = signingConfigs.debug
            // MainActivity passes test launch arguments on (see release).
            buildConfigField "boolean", "TAKES_LAUNCH_OPTIONS", "true"
        }
        release {
            // -PciRelease (E2E builds: CI's and scripts/e2e/e2e-build.sh): a real
            // release build (R8, bundled JS) signed with the debug key, and
            // nothing uploaded to Crashlytics.
            def ciRelease = project.hasProperty("ciRelease")
            if (ciRelease) {
                applyOtaConfig(delegate, true)
            }
            signingConfig = ciRelease ? signingConfigs.debug : signingConfigs.release
            // Only E2E builds take test launch arguments: in a store build,
            // any app could start learnX with them.
            buildConfigField "boolean", "TAKES_LAUNCH_OPTIONS", ciRelease ? "true" : "false"
            minifyEnabled = true
            // Drops resources nothing references once R8 has removed unused code
            // (AGP 9.3+ shrinks code and resources together).
            shrinkResources = true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            firebaseCrashlytics {
                mappingFileUploadEnabled = !ciRelease
                nativeSymbolUploadEnabled = !ciRelease
            }
        }
    }
}

// Per-ABI APKs (the github flavor) get their own version codes:
// 1,000,000,000 + build number * 10 + the ABI's digit, e.g. 1000045403 for
// arm64-v8a of build 4540. Up to 18.0.3 they were (versionCode * 1000 +
// digit), which overflowed Int (18.0.3's arm64-v8a APK is 614595411), so these
// start above that to keep sideloaded installs upgradable. The AAB for Google
// Play and the universal APK keep versionCode (9200000 + build number).
androidComponents {
    onVariants(selector().all()) { variant ->
        // React Native's Gradle plugin picks its libraries first in any
        // folder (`**/libreactnative.so`: NdkConfiguratorUtils.kt, in its
        // own onVariants, which runs before this one), and AGP applies that
        // before excludes, so the other ABIs' copies (12 MB of x86) stayed
        // in the universal APK. The same libraries are picked first only in
        // the ABIs the app is built for. A variant's property can't be read
        // here, so the plugin's list is repeated: a library it adds later
        // and this leaves out fails the build as found twice.
        def reactNativeLibs = ["libfbjni.so", "libreactnative.so", "libjsi.so", "libc++_shared.so", "libhermesvm.so", "libhermestooling.so"]
        def pickFirsts = variant.packaging.jniLibs.pickFirsts
        pickFirsts.empty()
        pickFirsts.addAll(android.packaging.jniLibs.pickFirsts)
        pickFirsts.addAll(reactNativeLibs.collectMany { lib ->
            builtAbis.collect { "lib/${it}/${lib}".toString() }
        })
        variant.outputs.each { output ->
            // x86 (2) is no longer built; don't reuse its digit
            def abiDigits = ["armeabi-v7a": 1, "arm64-v8a": 3, "x86_64": 4]
            def abi = output.filters.find {
                it.filterType == FilterConfiguration.FilterType.ABI
            }?.identifier
            if (abi != null) {
                def buildNumber = android.defaultConfig.versionCode - 9_200_000
                output.versionCode.set(1_000_000_000 + buildNumber * 10 + abiDigits[abi])
            }
        }
    }
}

// JVM unit tests of the app's own Kotlin (src/test: the Material 3 dialogs),
// with the local modules' setup; scripts/checks/test-android.sh runs them.
apply from: "../../modules/unit-tests.gradle"

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")

    implementation("androidx.core:core-splashscreen:1.2.0")
    implementation("com.google.android.material:material:1.14.0")

    implementation platform("com.google.firebase:firebase-bom:${rootProject.ext.firebaseBomVersion}")
    implementation("com.google.firebase:firebase-crashlytics")
    implementation("com.google.firebase:firebase-crashlytics-ndk")
    implementation("com.google.firebase:firebase-analytics")
}

// Fails the build when a patch in patches/ isn't applied to node_modules
// (scripts/checks/check-patches.sh).
def checkPatches = tasks.register("checkPatches", Exec) {
    commandLine "${rootDir}/../scripts/checks/check-patches.sh"
}
tasks.named("preBuild").configure { dependsOn checkPatches }

// expo-updates writes the embedded update's manifest (assets/app.manifest,
// the bundle's assets) in create<Variant>UpdatesResources, whose only inputs
// are strings, so Gradle took it as up to date after the JS changed: a release
// built after adding an asset (an icon) kept the old list, and the app couldn't
// find the new asset. Run it on every build, as the JS bundle is.
tasks.configureEach { task ->
    if (task.name ==~ /create\w+UpdatesResources/) {
        task.outputs.upToDateWhen { false }
    }
}
