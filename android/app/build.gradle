import com.android.build.api.variant.FilterConfiguration
import groovy.json.JsonSlurper

// Over-the-air updates: the URL and runtime version in app.json and the
// code-signing certificate in certs/ota-certificate.pem, as string resources the
// manifest's expo.modules.updates meta-data reads (iOS writes the same into
// Expo.plist with scripts/ota-config-ios.sh). E2E builds (-PciRelease) get the
// local test server (scripts/ota-e2e-server.mjs, through `adb reverse`), runtime
// version "e2e" and the test certificate from scripts/ota-e2e-cert.sh, so they
// never load a published update.
def otaResources(boolean e2e) {
    def root = rootProject.file("..")
    def appJson = new JsonSlurper().parse(new File(root, "app.json"))
    def certificate = e2e ? new File(root, "build/ota-e2e/certificate.pem") : new File(root, "certs/ota-certificate.pem")
    if (!certificate.exists()) {
        throw new GradleException("${certificate} is missing; for an E2E build, run scripts/ota-e2e-cert.sh first.")
    }
    return [
        expo_updates_url: e2e ? "http://localhost:8199/manifest" : appJson.updates.url,
        expo_runtime_version: e2e ? "e2e" : appJson.runtimeVersion,
        // A string resource keeps its line breaks only as \n escapes.
        expo_updates_certificate: certificate.text.trim().replace("\n", "\\n"),
    ]
}

plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "com.facebook.react"
    id "com.google.gms.google-services"
    id "com.google.firebase.crashlytics"
}

react {
    autolinkLibrariesWithApp()
    // Bundles with `expo export:embed`, as over-the-air updates are made with
    // `expo export`.
    cliFile = new File(["node", "--print", "require.resolve('@expo/cli', { paths: [require.resolve('expo/package.json')] })"].execute(null, rootDir).text.trim())
    bundleCommand = "export:embed"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(rootProject.ext.javaVersion.majorVersion)
    }
}

// The NDK, CMake and Java settings come from the root build.gradle, which sets
// them for every project.
android {
    compileSdk = rootProject.ext.compileSdkVersion

    namespace = "io.robertying.learnx"

    defaultConfig {
        applicationId = "io.robertying.learnx"
        minSdk = rootProject.ext.minSdkVersion
        targetSdk = rootProject.ext.targetSdkVersion
        versionCode = 9204544
        versionName = "19.0.0"
        otaResources(false).each { name, value -> resValue "string", name, value }
    }

    androidResources {
        // Chinese strings are Simplified (values-zh); values-b+zh+Hant repeats
        // them for Traditional Chinese, which would fall back to English.
        localeFilters += ["en", "zh", "b+zh+Hant"]
    }

    splits {
        abi {
            reset()
            enable = true
            universalApk = true
            // Follows reactNativeArchitectures, so CI can build a single ABI
            include(*project.property("reactNativeArchitectures").split(","))
        }
    }

    signingConfigs {
        debug {
            storeFile = file("debug.keystore")
            storePassword = "android"
            keyAlias = "androiddebugkey"
            keyPassword = "android"
        }

        // Release signing values; see android/local.properties.example. Without
        // the file, debug builds still work and release builds fail to sign.
        Properties properties = new Properties()
        def localProperties = project.rootProject.file("local.properties")
        if (localProperties.exists()) {
            localProperties.withInputStream { properties.load(it) }
        }

        release {
            storeFile = file("release.keystore")
            storePassword = properties.getProperty("LEARNX_RELEASE_STORE_PASSWORD")
            keyAlias = properties.getProperty("LEARNX_RELEASE_KEY_ALIAS")
            keyPassword = properties.getProperty("LEARNX_RELEASE_KEY_PASSWORD")
        }
    }

    buildTypes {
        debug {
            signingConfig = signingConfigs.debug
            // MainActivity passes test launch arguments on (see release).
            buildConfigField "boolean", "TAKES_LAUNCH_OPTIONS", "true"
        }
        release {
            // -PciRelease (E2E builds: CI's and scripts/e2e-build.sh): a real
            // release build (R8, bundled JS) signed with the debug key, and
            // nothing uploaded to Crashlytics.
            def ciRelease = project.hasProperty("ciRelease")
            if (ciRelease) {
                otaResources(true).each { name, value -> resValue "string", name, value }
            }
            signingConfig = ciRelease ? signingConfigs.debug : signingConfigs.release
            // Only E2E builds take test launch arguments: in a store build,
            // any app could start learnX with them.
            buildConfigField "boolean", "TAKES_LAUNCH_OPTIONS", ciRelease ? "true" : "false"
            minifyEnabled = true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            firebaseCrashlytics {
                mappingFileUploadEnabled = !ciRelease
                nativeSymbolUploadEnabled = !ciRelease
            }
        }
    }
}

// Per-ABI APKs (GitHub Releases and the TUNA mirror) get their own version
// codes: 1,000,000,000 + build number * 10 + the ABI's digit, e.g. 1000045403
// for arm64-v8a of build 4540. Up to 18.0.3 they were (versionCode * 1000 +
// digit), which overflowed Int (18.0.3's arm64-v8a APK is 614595411), so these
// start above that to keep sideloaded installs upgradable. The AAB for Google
// Play and the universal APK keep versionCode (9200000 + build number).
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            // x86 (2) is no longer built; don't reuse its digit
            def abiDigits = ["armeabi-v7a": 1, "arm64-v8a": 3, "x86_64": 4]
            def abi = output.filters.find {
                it.filterType == FilterConfiguration.FilterType.ABI
            }?.identifier
            if (abi != null) {
                def buildNumber = android.defaultConfig.versionCode - 9_200_000
                output.versionCode.set(1_000_000_000 + buildNumber * 10 + abiDigits[abi])
            }
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")

    implementation("androidx.core:core-splashscreen:1.2.0")
    implementation("com.google.android.material:material:1.14.0")

    implementation platform("com.google.firebase:firebase-bom:${rootProject.ext.firebaseBomVersion}")
    implementation("com.google.firebase:firebase-crashlytics")
    implementation("com.google.firebase:firebase-crashlytics-ndk")
    implementation("com.google.firebase:firebase-analytics")
}

// Fails the build when a patch in patches/ isn't applied to node_modules
// (scripts/check-patches.sh).
def checkPatches = tasks.register("checkPatches", Exec) {
    commandLine "${rootDir}/../scripts/check-patches.sh"
}
tasks.named("preBuild").configure { dependsOn checkPatches }
