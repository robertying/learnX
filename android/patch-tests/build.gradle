// Tests of what the patches in patches/ change in libraries' Android code
// (src/test: JUnit, Robolectric, MockK; scripts/checks/test-android.sh runs them).
// Nothing links this project: it only has tests, against the patched
// libraries' Gradle projects.
buildscript {
  repositories {
    mavenCentral()
  }
  dependencies {
    // For the Compose tests of @expo/ui, as @expo/ui itself adds it.
    classpath("org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:${kotlinVersion}")
  }
}

plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

// The Expo module plugin wants both, though nothing is published.
group = 'io.robertying.learnx'
version = '1.0.0'

android {
  namespace = "io.robertying.learnx.patches"
  buildFeatures {
    compose = true
  }
}

apply from: "../../modules/unit-tests.gradle"

dependencies {
  testImplementation project(':expo-calendar')
  testImplementation project(':expo-ui')
  testImplementation project(':expo-document-picker')
  testImplementation project(':expo-widgets')
  // What those libraries use without exposing it to their dependents.
  testImplementation 'com.facebook.react:react-android'
  testImplementation 'androidx.glance:glance-appwidget:1.2.0'
  testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2'
  testImplementation 'androidx.compose.foundation:foundation-android:1.13.0'
  // The version @expo/ui builds with, for Text's style in its tests
  testImplementation 'androidx.compose.material3:material3-android:1.5.0'
  testImplementation 'androidx.compose.ui:ui-test-junit4:1.13.0'
  testImplementation 'androidx.compose.ui:ui-test-manifest:1.13.0'
}
