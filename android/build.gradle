buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 28
        compileSdkVersion = 37
        targetSdkVersion = 37
        ndkVersion = "30.0.16248370"
        cmakeVersion = "4.1.2"
        javaVersion = JavaVersion.VERSION_17
        kotlinVersion = "2.4.20"
        kspVersion = "2.3.13"
        // The app and modules/crashlytics link the same Firebase.
        firebaseBomVersion = "35.1.0"
        // Unit tests of the local modules (modules/*/android/src/test).
        junitVersion = "4.13.2"
        robolectricVersion = "4.17"
        mockkVersion = "1.14.12"
    }
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
    }
}

plugins {
    id "com.facebook.react.rootproject" apply false
    id "expo-root-project" apply false
    id "com.google.gms.google-services" version "4.5.0" apply false
    id "com.google.firebase.crashlytics" version "3.0.8" apply false
    id 'com.android.application' version '9.5.1' apply false
}

// Libraries read compileSdk, minSdk and targetSdk from the ext block above.
// Set for every project (the app and every library): the NDK and CMake (one with its own, expo-widgets'
// 28.2, would make Gradle download a second NDK), and one Java and Kotlin JVM
// target, so a library's Java and Kotlin classes agree.
subprojects { subproject ->
    afterEvaluate {
        if (subproject.hasProperty("android")) {
            android {
                ndkVersion = rootProject.ext.ndkVersion
                externalNativeBuild {
                    cmake {
                        version = rootProject.ext.cmakeVersion
                    }
                }
                // CMake 4 rejects a cmake_minimum_required below 3.5, which
                // expo-updates still declares (3.4.1).
                defaultConfig {
                    externalNativeBuild {
                        cmake {
                            arguments "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
                        }
                    }
                }
                compileOptions {
                    sourceCompatibility = rootProject.ext.javaVersion
                    targetCompatibility = rootProject.ext.javaVersion
                }
                if (subproject.plugins.hasPlugin("org.jetbrains.kotlin.android")) {
                    kotlin {
                        jvmToolchain {
                            languageVersion = JavaLanguageVersion.of(rootProject.ext.javaVersion.majorVersion)
                        }
                    }
                }
            }
        }
    }
}
