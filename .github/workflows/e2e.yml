name: E2E

# Runs the Maestro flows in .maestro/ (scripts/e2e.sh) against a debug build
# on a simulator or emulator, with Metro on the runner and the mock account.
# By hand only: an iOS run builds from scratch (~50 min), and the Android flows
# aren't maintained, so expect drift there (.maestro/AGENTS.md). Not a
# required check, and it saves no caches.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform
        type: choice
        options: [ios, android]
        default: ios

concurrency:
  group: e2e-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MAESTRO_VERSION: 2.12.1
  MAESTRO_CLI_NO_ANALYTICS: 'true'
  MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: 'true'

jobs:
  ios:
    name: iOS
    if: inputs.platform == 'ios'
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Any non-empty values work: they only switch the login to mock data.
      - name: Write .env
        run: printf 'DUMMY_USERNAME=e2e\nDUMMY_PASSWORD=e2e\n' > .env

      - name: Restore Pods
        uses: actions/cache/restore@v6
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock', 'patches/**') }}
          restore-keys: pods-${{ runner.os }}-

      - name: Install pods
        working-directory: ios
        run: bundle exec pod install
        env:
          LANG: en_US.UTF-8

      - name: Pick a simulator
        run: |
          device="$(xcrun simctl list devices available --json |
            jq -r '[.devices | to_entries | sort_by(.key)[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))] | last | .udid')"
          echo "Simulator: $device"
          echo "MAESTRO_DEVICE=$device" >> "$GITHUB_ENV"
          xcrun simctl boot "$device"

      # Signed to run locally (the simulator default), so the app keeps its
      # App Group and keychain entitlements.
      - name: Build
        run: |
          mkdir -p build
          xcodebuild build \
            -workspace ios/learnX.xcworkspace \
            -scheme learnX \
            -configuration Debug \
            -destination "id=$MAESTRO_DEVICE" \
            -derivedDataPath build/DerivedData \
            COMPILER_INDEX_STORE_ENABLE=NO \
            > build/xcodebuild.log 2>&1 || {
            grep -E 'error:' build/xcodebuild.log | sort -u | head -50
            tail -n 80 build/xcodebuild.log
            exit 1
          }
          tail -n 5 build/xcodebuild.log

      - name: Install app
        run: xcrun simctl install "$MAESTRO_DEVICE" build/DerivedData/Build/Products/Debug-iphonesimulator/learnX.app

      - name: Start Metro
        run: scripts/ci-metro.sh ios

      - name: Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run flows
        run: scripts/e2e.sh ios --format junit --output build/maestro/report.xml --test-output-dir build/maestro

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-ios
          path: |
            build/maestro
            build/metro.log
            build/xcodebuild.log
          if-no-files-found: ignore

  android:
    name: Android
    if: inputs.platform == 'android'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # Reads main's Gradle home (and build cache) without writing to it.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write .env
        run: printf 'DUMMY_USERNAME=e2e\nDUMMY_PASSWORD=e2e\n' > .env

      - name: Build debug APK
        working-directory: android
        run: ./gradlew app:assembleDebug -PreactNativeArchitectures=x86_64 --build-cache

      - name: Start Metro
        run: scripts/ci-metro.sh android

      - name: Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-x86_64-debug.apk
            adb reverse tcp:8081 tcp:8081
            scripts/e2e.sh android --format junit --output build/maestro/report.xml --test-output-dir build/maestro

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-android
          path: |
            build/maestro
            build/metro.log
          if-no-files-found: ignore
