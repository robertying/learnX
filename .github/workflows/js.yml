name: JS

# The JS checks every pull request must pass: Checks (typecheck, lint, format,
# runtime version, ShellCheck, Jest, the release lanes' Ruby tests) and Release
# bundles. Both are required.
# Android is in android.yml, the Apple builds in apple.yml and the Windows and
# Linux app in electron.yml.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same pull request or to main cancels the older run: the
# newest run checks everything the older one would have (its commits too) and
# saves the caches. Manual runs each get their own group, so a push never
# cancels them and they never cancel a push run.
concurrency:
  group: js-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Only main saves the Jest cache, so other refs start from main's and can't
# evict or poison it. caches.yml prunes superseded ones after each main run.
env:
  SAVE_CACHE: ${{ github.ref == 'refs/heads/main' }}
  JEST_CACHE_DIR: ${{ github.workspace }}/.jest-cache

jobs:
  checks:
    # Typecheck, lint, format, the over-the-air runtime version, ShellCheck,
    # Jest (with its coverage thresholds) and the release lanes' Ruby tests
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JS
        id: install
        uses: ./.github/actions/setup-js

      # The checks below run even if an earlier one fails, so one push shows
      # every failure. They're skipped only when setup failed.
      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint --deny-warnings

      - name: Format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm format --check

      # The over-the-air runtime version changes exactly when native code does
      # (scripts/checks/check-ota-runtime.mjs); on failure it prints what to record.
      - name: Runtime version
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm ota:check

      # Catches shell mistakes before a script only runs on main
      - name: Shell scripts
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: shellcheck --version | head -2 && pnpm lint:shell

      # The release logic the Fastfile uses (fastlane/release.rb). Plain Ruby
      # and minitest, which comes with Ruby, so no gems to install. The Ruby
      # version comes from .ruby-version.
      - name: Set up Ruby
        id: ruby
        if: ${{ !cancelled() }}
        uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0

      - name: Release lane tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.ruby.outcome == 'success' }}
        run: pnpm test:fastlane

      # Jest's cache holds Babel output, mostly for node_modules. Its key
      # follows what changes that output (the Babel plugins in babel/ too,
      # which babel-jest's own per-file key leaves out); source files that
      # changed since are just transformed again, and the preval files'
      # inputs are in their per-file key (jest/transformer.js).
      - name: Restore Jest cache
        id: jest-cache
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.JEST_CACHE_DIR }}
          key: jest-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'patches/**', 'babel.config.js', 'babel/**', 'jest.config.js', 'jest/transformer.js') }}

      - name: Test
        id: test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test --coverage --cacheDirectory "$JEST_CACHE_DIR"

      - name: Save Jest cache
        if: env.SAVE_CACHE == 'true' && steps.test.outcome == 'success' && steps.jest-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.JEST_CACHE_DIR }}
          key: ${{ steps.jest-cache.outputs.cache-primary-key }}

  release-bundles:
    # A job of its own, as it takes longer than every other check together.
    name: Release bundles
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JS
        uses: ./.github/actions/setup-js

      # Builds the Android and iOS release JS bundles (production Babel and
      # Metro, which Jest doesn't run) and fails if one contains a .env value
      # other than the mock login. The .env has a made-up value for every key,
      # and one babel/inline-env.js doesn't know, so any leak shows up.
      - name: Release bundles
        run: |
          cat > .env <<'ENV'
          DUMMY_USERNAME=ci-mock-user
          DUMMY_PASSWORD=ci-mock-password
          LIVE_USERNAME=ci-canary-live-username
          LIVE_PASSWORD=ci-canary-live-password
          LIVE_FINGERPRINT=ci-canary-live-fingerprint
          UNLISTED_KEY=ci-canary-unlisted-key
          ENV
          scripts/checks/check-release-bundle.sh
