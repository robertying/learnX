name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, lint, format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Version comes from the `packageManager` field in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      # src/helpers/env.ts inlines .env at build time via babel preval.
      # CI only needs placeholder values so anything that runs Babel can load it.
      - name: Write stub .env
        run: |
          cat > .env <<'ENV'
          DUMMY_USERNAME=ci-dummy-username
          DUMMY_PASSWORD=ci-dummy-password
          DUMMY_PERSIST_USERNAME=ci-dummy-persist-username
          DUMMY_PERSIST_PASSWORD=ci-dummy-persist-password
          COURSEX_REFRESH_TOKEN=ci-dummy-token
          ENV

      # The checks below run even if an earlier one fails, so one push shows
      # every failure. They're skipped only when setup failed.
      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint --deny-warnings

      - name: Format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm format --check

      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test

  fastlane:
    name: Fastlane lanes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby
          bundler-cache: true

      # Loads the Fastfile and lists its lanes, so a broken Fastfile fails here
      # rather than in the middle of a release.
      - name: List lanes
        run: bundle exec fastlane lanes
        env:
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          FASTLANE_OPT_OUT_USAGE: '1'
          LC_ALL: C.UTF-8
          LANG: C.UTF-8
