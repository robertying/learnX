name: CI

# Pull requests run the required checks: JS checks, Release bundles, and
# Android (whose steps skip themselves when no Android path changed). Main
# pushes and manual runs (Actions > CI > Run workflow, on main or a branch)
# always build Android and run the Android E2E flows on that build. The Apple
# builds are in apple.yml, by hand only.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A new push to a PR cancels that PR's older run. Main pushes and manual runs
# each get their own group, so another merge can't cancel them (and the caches
# they save).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

# Only main saves caches (Jest, Gradle, ccache), so other refs start from
# main's and can't evict or poison them. caches.yml prunes superseded ones
# after each main run.
env:
  SAVE_CACHE: ${{ github.ref == 'refs/heads/main' }}
  JEST_CACHE_DIR: ${{ github.workspace }}/.jest-cache
  # Main pushes and manual runs: build Android every time and run E2E on it.
  FULL_RUN: ${{ github.event_name != 'pull_request' }}

jobs:
  js:
    # Typecheck, lint, format, ShellCheck and Jest (with its coverage
    # thresholds)
    name: JS checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JS
        id: install
        uses: ./.github/actions/setup-js

      # The checks below run even if an earlier one fails, so one push shows
      # every failure. They're skipped only when setup failed.
      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint --deny-warnings

      - name: Format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm format --check

      # Catches shell mistakes before a script only runs on main
      - name: Shell scripts
        if: ${{ !cancelled() }}
        run: shellcheck --version | head -2 && git ls-files -z '*.sh' | xargs -0 shellcheck

      # Jest's cache holds Babel output, mostly for node_modules. Its key
      # follows what changes that output (the Babel plugins in babel/ too,
      # which babel-jest's own per-file key leaves out); source files that
      # changed since are just transformed again, and the preval files'
      # inputs are in their per-file key (jest/transformer.js).
      - name: Restore Jest cache
        id: jest-cache
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.JEST_CACHE_DIR }}
          key: jest-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'patches/**', 'babel.config.js', 'babel/**', 'jest.config.js', 'jest/transformer.js') }}

      - name: Test
        id: test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test --coverage --cacheDirectory "$JEST_CACHE_DIR"

      - name: Save Jest cache
        if: env.SAVE_CACHE == 'true' && steps.test.outcome == 'success' && steps.jest-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.JEST_CACHE_DIR }}
          key: ${{ steps.jest-cache.outputs.cache-primary-key }}

  release-bundles:
    # A job of its own, as it takes longer than every other JS check together.
    name: Release bundles
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JS
        uses: ./.github/actions/setup-js

      # Builds the Android and iOS release JS bundles (production Babel and
      # Metro, which Jest doesn't run) and fails if one contains a .env value
      # other than the mock login. The .env has a made-up value for every key,
      # and one babel/inline-env.js doesn't know, so any leak shows up.
      - name: Release bundles
        run: |
          cat > .env <<'ENV'
          DUMMY_USERNAME=ci-mock-user
          DUMMY_PASSWORD=ci-mock-password
          COURSEX_REFRESH_TOKEN=ci-canary-coursex-token
          LIVE_USERNAME=ci-canary-live-username
          LIVE_PASSWORD=ci-canary-live-password
          LIVE_FINGERPRINT=ci-canary-live-fingerprint
          UNLISTED_KEY=ci-canary-unlisted-key
          ENV
          scripts/check-release-bundle.sh

  android:
    # The local modules' JVM unit tests (scripts/test-android.sh) and a release
    # APK (R8 and the bundled JS; -PciRelease signs it with the debug key and
    # turns off Crashlytics uploads, android/app/build.gradle). A required
    # check: on a pull request that changes nothing Android, every step after
    # the first is skipped and the job passes in seconds.
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # Pull requests only: the app's Gradle setup, the modules' Android code
      # and autolinking, patched and installed packages, app config, and the
      # scripts and workflow that build them. The steps below run unless this
      # says nothing changed.
      - name: Detect changed files
        id: changes
        if: env.FULL_RUN != 'true'
        run: scripts/changed-files.sh >> "$GITHUB_OUTPUT"

      - name: Set up JS
        id: install
        if: steps.changes.outputs.changed != 'false'
        uses: ./.github/actions/setup-js

      - name: Set up Java
        if: steps.changes.outputs.changed != 'false'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # The build cache lives in the Gradle home that setup-gradle restores,
      # so pull requests reuse main's compiled outputs (dependency modules,
      # Gradle plugins) and only rebuild what changed.
      - name: Set up Gradle
        id: gradle
        if: steps.changes.outputs.changed != 'false'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ env.SAVE_CACHE != 'true' }}

      # Keeps compiled C/C++ between runs.
      - name: Set up ccache
        id: ccache
        if: steps.changes.outputs.changed != 'false'
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: android
          save: ${{ env.SAVE_CACHE }}

      - name: Unit tests
        if: steps.changes.outputs.changed != 'false'
        run: scripts/test-android.sh --build-cache

      # The release bundle inlines .env; the mock login is what E2E logs in
      # with. Any non-empty values work, as they only switch to mock data.
      # One ABI is enough to compile every native module and keeps the build
      # short. CMake (3.17+) picks up the compiler launchers from the
      # environment. Runs even if the unit tests failed, so one push shows
      # both, and reuses their Gradle daemon.
      - name: Build release APK
        if: >-
          !cancelled() && steps.changes.outputs.changed != 'false' &&
          steps.install.outcome == 'success' && steps.gradle.outcome == 'success' &&
          steps.ccache.outcome == 'success'
        run: |
          printf 'DUMMY_USERNAME=e2e\nDUMMY_PASSWORD=e2e\n' > .env
          cd android
          ./gradlew app:assembleRelease -PciRelease -PreactNativeArchitectures=x86_64 --build-cache
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          # An E2E build, as scripts/e2e-build.sh makes (babel/inline-env.js).
          TEST_LOGIN: '1'

      - name: Show ccache stats
        if: ${{ !cancelled() && steps.ccache.outcome == 'success' }}
        run: ccache --show-stats || true

      - name: Upload APK for E2E
        if: env.FULL_RUN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: apk
          path: android/app/build/outputs/apk/release/app-x86_64-release.apk
          retention-days: 1

  android-e2e:
    # The Maestro flows (scripts/e2e.sh) in an emulator on the APK from
    # Android, after each main push and in manual runs. The first flow logs in
    # through the real SSO login, so it needs id.tsinghua.edu.cn reachable from
    # the runner. The flows are kept passing here, as on the local devices
    # (.maestro/AGENTS.md). No iOS E2E in CI. Runs once in English and once
    # in Chinese, the emulator's system language (a per-app language doesn't
    # survive the flows' clearState).
    name: Android E2E tests (${{ matrix.locale }})
    needs: android
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        locale: [en-US, zh-CN]
    timeout-minutes: 60
    env:
      MAESTRO_VERSION: 2.12.1
      MAESTRO_CLI_NO_ANALYTICS: 'true'
      MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download APK
        uses: actions/download-artifact@v8
        with:
          name: apk
          path: build

      # scripts/e2e.sh reads the flows' labels and mock texts from the
      # translations and mock data (scripts/e2e-env.mjs), which import packages.
      - name: Set up JS
        uses: ./.github/actions/setup-js

      # scripts/e2e.sh types the mock login from .env; same values as the build.
      - name: Write .env
        run: printf 'DUMMY_USERNAME=e2e\nDUMMY_PASSWORD=e2e\n' > .env

      - name: Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          # The action's default options, and the system language
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -change-locale ${{ matrix.locale }}
          # About a minute after boot, the emulator sometimes drops its adb
          # connection for a moment ("device offline"), which fails whichever
          # flow is running. A throwaway reset first starts Maestro's driver
          # and gets past that window, so the flows below start on a settled
          # device; its result doesn't count.
          # -change-locale restarts Android's framework once it has booted,
          # which breaks an install made meanwhile: wait for the language to
          # be set and the package service to answer, then a little more. In
          # Chinese, Gboard would compose the flows' ASCII search terms as
          # Pinyin, so it's turned off: Maestro's text goes in as key presses.
          script: |
            for i in $(seq 60); do [ "$(adb shell getprop persist.sys.locale | tr -d '\r')" = "${{ matrix.locale }}" ] && adb shell pm path android > /dev/null 2>&1 && break; sleep 5; done; sleep 30; adb shell getprop persist.sys.locale
            if [ "${{ matrix.locale }}" = zh-CN ]; then adb shell ime disable com.google.android.inputmethod.latin/com.android.inputmethod.latin.LatinIME; fi
            adb install -r build/app-x86_64-release.apk
            scripts/e2e.sh android .maestro/subflows/reset.yaml || echo "Warm-up run failed; running the flows anyway"
            mkdir -p build/maestro; scripts/e2e.sh android --format junit --output build/maestro/report.xml --test-output-dir build/maestro; status=$?; adb logcat -d > build/maestro/logcat.txt; exit $status

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-android-${{ matrix.locale }}
          path: build/maestro
          if-no-files-found: ignore
