name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR cancels that PR's older run. Main pushes and manual runs
# each get their own group, so another merge can't cancel them (and the caches
# they save).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

# Only main saves the Jest cache, so other refs don't spend the repo's 10 GB
# cache limit, which the Xcode caches in native.yml need.
env:
  SAVE_CACHE: ${{ github.ref == 'refs/heads/main' }}
  JEST_CACHE_DIR: ${{ github.workspace }}/.jest-cache

jobs:
  js:
    # Typecheck, lint, format, ShellCheck, Jest (with its coverage
    # thresholds) and the release JS bundles
    name: JS checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To prune superseded caches on main
      actions: write
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JS
        id: install
        uses: ./.github/actions/setup-js

      # The checks below run even if an earlier one fails, so one push shows
      # every failure. They're skipped only when setup failed.
      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint --deny-warnings

      - name: Format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm format --check

      # Catches shell mistakes before a script only runs on main
      - name: Shell scripts
        if: ${{ !cancelled() }}
        run: shellcheck --version | head -2 && git ls-files -z '*.sh' | xargs -0 shellcheck

      # Jest's cache holds Babel output, mostly for node_modules. Its key
      # follows what changes that output (the Babel plugins in babel/ too,
      # which babel-jest's own per-file key leaves out); source files that
      # changed since are just transformed again, and the preval files'
      # inputs are in their per-file key (jest/transformer.js).
      - name: Restore Jest cache
        id: jest-cache
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.JEST_CACHE_DIR }}
          key: jest-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'patches/**', 'babel.config.js', 'babel/**', 'jest.config.js', 'jest/transformer.js') }}

      - name: Test
        id: test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test --coverage --cacheDirectory "$JEST_CACHE_DIR"

      - name: Save Jest cache
        if: env.SAVE_CACHE == 'true' && steps.test.outcome == 'success' && steps.jest-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.JEST_CACHE_DIR }}
          key: ${{ steps.jest-cache.outputs.cache-primary-key }}

      # Builds the Android and iOS release JS bundles (production Babel and
      # Metro, which Jest doesn't run) and fails if one contains a .env value
      # other than the mock login. The .env has a made-up value for every key,
      # and one babel/inline-env.js doesn't know, so any leak shows up.
      - name: Release bundles
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          cat > .env <<'ENV'
          DUMMY_USERNAME=ci-mock-user
          DUMMY_PASSWORD=ci-mock-password
          COURSEX_REFRESH_TOKEN=ci-canary-coursex-token
          LIVE_USERNAME=ci-canary-live-username
          LIVE_PASSWORD=ci-canary-live-password
          LIVE_FINGERPRINT=ci-canary-live-fingerprint
          UNLISTED_KEY=ci-canary-unlisted-key
          ENV
          scripts/check-release-bundle.sh

      # Drops caches that newer ones replaced (old Gradle, ccache, Pods, Xcode
      # and Jest entries), so the repo stays under its 10 GB limit.
      - name: Prune caches
        if: always() && env.SAVE_CACHE == 'true'
        run: scripts/prune-caches.sh
        env:
          GH_TOKEN: ${{ github.token }}

  android-unit-tests:
    # The local modules' JVM unit tests (scripts/test-android.sh). A required
    # check: when nothing Android changed, every step after the first is
    # skipped and the job passes in seconds.
    name: Android unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # What the Android unit tests compile or run: the app's Gradle setup,
      # the local modules' Android code and autolinking, patched and installed
      # packages, and the scripts and workflow that run them.
      - name: Detect changed files
        id: changes
        run: >-
          scripts/changed-files.sh android-unit >> "$GITHUB_OUTPUT"

      - name: Set up JS
        if: steps.changes.outputs.changed == 'true'
        uses: ./.github/actions/setup-js

      - name: Set up Java
        if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        if: steps.changes.outputs.changed == 'true'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ env.SAVE_CACHE != 'true' }}

      # The build cache lives in the Gradle home that setup-gradle restores,
      # so PRs reuse main's compiled outputs (dependency modules, Gradle
      # plugins) and only rebuild what changed.
      - name: Test
        if: steps.changes.outputs.changed == 'true'
        run: scripts/test-android.sh --build-cache
