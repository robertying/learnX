name: Native

# Builds the app so a broken patch, Podfile, Gradle, R8 or native module change
# shows up in CI, not on a Mac later, runs the native iOS tests, and runs the
# Android E2E flows by hand. No signing secrets, no uploads. Not required
# checks.
#
# When each job runs:
# - Android release build (~10 min cold): PRs and main pushes that touch
#   Android paths (its first step checks; otherwise the rest is skipped), and
#   by hand. A release build, because R8 and the JS bundle only run there;
#   -PciRelease signs it with the debug key and turns off Crashlytics uploads
#   (android/app/build.gradle).
# - Apple (iOS), build + native tests (~47 min cold): by hand only, with the
#   "iOS: build and native tests" box ticked (the default). Run it on main to
#   refresh the compilation cache, or on a branch to check it.
# - Apple (Mac), build (~35 min, uncached): by hand only, with the "Mac:
#   build" box ticked.
# - Android E2E tests: by hand only, with the "Android E2E tests" box ticked.
#   Runs the Maestro flows (scripts/e2e.sh) in an emulator on the APK from the
#   Android release build. The Android flows aren't maintained, so expect
#   drift there (.maestro/AGENTS.md). No iOS E2E in CI for now.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ios:
        description: 'iOS: build and native tests'
        type: boolean
        default: true
      mac:
        description: 'Mac: build'
        type: boolean
        default: false
      e2e:
        description: Android E2E tests
        type: boolean
        default: false

# A new push to a PR cancels that PR's older run. Main pushes and manual runs
# each get their own group, so another merge can't cancel them (and the caches
# they save).
concurrency:
  group: native-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

# ccache keeps compiled C/C++ between Android runs. Only main saves caches
# (Gradle, ccache, Pods, Xcode compilation cache), so other refs start from
# main's and can't evict or poison them.
env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_MAXSIZE: 2G
  CCACHE_COMPRESS: 'true'
  SAVE_CACHE: ${{ github.ref == 'refs/heads/main' }}
  E2E: ${{ inputs.e2e == true }}
  MAESTRO_VERSION: 2.12.1
  MAESTRO_CLI_NO_ANALYTICS: 'true'
  MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: 'true'

jobs:
  android:
    name: Android release build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # The app's Gradle setup, the modules' Android code and autolinking,
      # patched and installed packages, and app config. Manual runs always
      # build.
      - name: Detect changed files
        id: changes
        run: >-
          scripts/changed-files.sh
          '^(android/|modules/[^/]+/(android/|expo-module\.config\.json$)|patches/|package\.json$|pnpm-(lock|workspace)\.yaml$|app\.json$|\.node-version$|scripts/changed-files\.sh$|\.github/workflows/build\.yml$)'
          >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        if: steps.changes.outputs.changed == 'true'
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          # Not cached, as in check.yml: the ~200 MB store restores no faster
          # than a cold install and would crowd the Xcode caches out of the
          # repo's 10 GB.
          package-manager-cache: false

      - name: Set up Java
        if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        if: steps.changes.outputs.changed == 'true'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ env.SAVE_CACHE != 'true' }}

      - name: Set up ccache
        if: steps.changes.outputs.changed == 'true'
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: android
          save: ${{ env.SAVE_CACHE }}

      - name: Install dependencies
        if: steps.changes.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile

      # The release bundle inlines .env; the mock login is what E2E logs in
      # with. Any non-empty values work, as they only switch to mock data.
      - name: Write .env
        if: steps.changes.outputs.changed == 'true'
        run: printf 'DUMMY_USERNAME=e2e\nDUMMY_PASSWORD=e2e\n' > .env

      # One ABI is enough to compile every native module and keeps the build
      # short. CMake (3.17+) picks up the compiler launchers from the environment.
      - name: Build release APK
        if: steps.changes.outputs.changed == 'true'
        working-directory: android
        run: ./gradlew app:assembleRelease -PciRelease -PreactNativeArchitectures=x86_64 --build-cache --no-daemon
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache

      - name: Show ccache stats
        if: always() && steps.changes.outputs.changed == 'true'
        run: ccache --show-stats || true

      - name: Upload APK for E2E
        if: steps.changes.outputs.changed == 'true' && env.E2E == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: apk
          path: android/app/build/outputs/apk/release/app-x86_64-release.apk
          retention-days: 1

  apple:
    # A static name: a skipped matrix job can't expand ${{ matrix.name }}, so
    # GitHub would show the raw expression. Rows show as "Apple (iOS)" (build
    # and native tests) and "Apple (Mac)" (build).
    name: Apple
    # By hand only, for the boxes ticked.
    if: github.event_name == 'workflow_dispatch' && (inputs.ios || inputs.mac)
    runs-on: macos-26
    timeout-minutes: 120
    permissions:
      contents: read
      # To delete older compilation caches
      actions: write
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(inputs.ios && (inputs.mac && '["iOS","Mac"]' || '["iOS"]') || '["Mac"]') }}
    env:
      # Only iOS keeps a compilation cache (see the top of this file).
      CACHE_CAS: ${{ matrix.name == 'iOS' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          # Not cached, as in check.yml: the ~200 MB store restores no faster
          # than a cold install and would crowd the Xcode caches out of the
          # repo's 10 GB.
          package-manager-cache: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          # Version comes from .ruby-version.
          bundler-cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Pods
        id: pods
        uses: actions/cache/restore@v6
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock', 'patches/**') }}
          restore-keys: pods-${{ runner.os }}-

      # Not --deployment: ExpoWidgets' podspec embeds the checkout's absolute
      # path, so its checksum in Podfile.lock differs on every machine.
      - name: Install pods
        working-directory: ios
        run: bundle exec pod install
        env:
          LANG: en_US.UTF-8

      # Both matrix jobs make the same Pods; whichever finishes second skips the save.
      - name: Save Pods
        if: env.SAVE_CACHE == 'true' && steps.pods.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ steps.pods.outputs.cache-primary-key }}

      # Xcode's own compilation cache (Swift and C-family). ccache doesn't work
      # here: Xcode 26 never calls the CC wrapper React Native sets up.
      - name: Restore compilation cache
        if: env.CACHE_CAS == 'true'
        uses: actions/cache/restore@v6
        with:
          path: build/DerivedData/CompilationCache.noindex
          key: xcode-cas-${{ matrix.name }}-${{ github.sha }}
          restore-keys: xcode-cas-${{ matrix.name }}-

      - name: Pick a simulator
        if: matrix.name == 'iOS'
        run: |
          device="$(xcrun simctl list devices available --json |
            jq -r '[.devices | to_entries | sort_by(.key)[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))] | last | .udid')"
          echo "Simulator: $device"
          echo "SIMULATOR=$device" >> "$GITHUB_ENV"

      # iOS: the native tests (scripts/test-ios.sh) build the app and every
      # module, so they also prove it compiles. Signed to run locally (the
      # simulator default), which keeps the App Group entitlement the tests
      # need; no certificates involved.
      - name: Test
        id: test
        if: matrix.name == 'iOS'
        run: scripts/test-ios.sh "$SIMULATOR"
        env:
          DERIVED_DATA: build/DerivedData
          XCODEBUILD_ARGS: COMPILER_INDEX_STORE_ENABLE=NO COMPILATION_CACHE_ENABLE_CACHING=YES

      # Mac: no signing certificates on CI, so this only proves the code
      # compiles and links. Build signed when running the app.
      - name: Build
        if: matrix.name == 'Mac'
        run: |
          mkdir -p build
          xcodebuild build \
            -workspace ios/learnX.xcworkspace \
            -scheme learnX \
            -configuration Debug \
            -destination "generic/platform=macOS,variant=Mac Catalyst" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            > build/xcodebuild.log 2>&1 || {
            grep -E 'error:' build/xcodebuild.log | sort -u | head -50
            tail -n 80 build/xcodebuild.log
            exit 1
          }
          tail -n 5 build/xcodebuild.log

      - name: Save compilation cache
        if: always() && env.CACHE_CAS == 'true' && env.SAVE_CACHE == 'true'
        uses: actions/cache/save@v6
        with:
          path: build/DerivedData/CompilationCache.noindex
          key: xcode-cas-${{ matrix.name }}-${{ github.sha }}

      # The cache is ~5.5 GB and each main commit saves its own copy, so drop
      # the older ones before they evict Gradle and Pods from the 10 GB limit.
      - name: Delete older compilation caches
        if: always() && env.CACHE_CAS == 'true' && env.SAVE_CACHE == 'true'
        continue-on-error: true
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --key "xcode-cas-${{ matrix.name }}-" --limit 100 --json key --jq '.[].key' |
            grep -vx "xcode-cas-${{ matrix.name }}-$GITHUB_SHA" |
            while read -r key; do gh cache delete --repo "$GITHUB_REPOSITORY" "$key"; done
          # What's left, against the 10 GB limit (largest first).
          gh cache list --repo "$GITHUB_REPOSITORY" --limit 100 --sort size_in_bytes --json key,sizeInBytes \
            --jq '.[] | "\(.sizeInBytes / 1048576 | floor) MB  \(.key)"'
          gh api "repos/$GITHUB_REPOSITORY/actions/cache/usage" --jq '"Total: \(.active_caches_size_in_bytes / 1048576 | floor) MB in \(.active_caches_count) caches"'
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xcodebuild-${{ matrix.name }}
          path: |
            build/xcodebuild.log
            build/DerivedData/results/*.xcresult
          if-no-files-found: ignore

  android-e2e:
    name: Android E2E tests
    needs: android
    if: inputs.e2e
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download APK
        uses: actions/download-artifact@v8
        with:
          name: apk
          path: build

      # scripts/e2e.sh types the mock login from .env; same values as the build.
      - name: Write .env
        run: printf 'DUMMY_USERNAME=e2e\nDUMMY_PASSWORD=e2e\n' > .env

      - name: Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: |
            adb install -r build/app-x86_64-release.apk
            mkdir -p build/maestro; scripts/e2e.sh android --format junit --output build/maestro/report.xml --test-output-dir build/maestro; status=$?; adb logcat -d > build/maestro/logcat.txt; exit $status

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-android
          path: build/maestro
          if-no-files-found: ignore
