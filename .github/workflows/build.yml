name: Build

# Compiles debug builds so a broken patch, Podfile, Gradle or native module
# change shows up in CI, not on a Mac later, and runs the native iOS tests. No
# JS bundle, no uploads. Not required checks.
#
# When each job runs (the Changes job decides from the changed paths):
# - Android (~6 min): PRs and main pushes that touch Android paths, and by hand.
# - iOS (build + native tests, ~47 min cold): main pushes that touch iOS paths,
#   and by hand. Too slow to gate PRs; run it by hand on a branch when needed.
# - Mac (~35 min, uncached): by hand only, with the "Build Mac" box ticked.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mac:
        description: Build Mac
        type: boolean
        default: false

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# ccache keeps compiled C/C++ between Android runs. Only main saves caches
# (Gradle, ccache, Pods, Xcode compilation cache), so other refs start from
# main's and can't evict or poison them.
env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_MAXSIZE: 2G
  CCACHE_COMPRESS: 'true'
  SAVE_CACHE: ${{ github.ref == 'refs/heads/main' }}

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android: ${{ steps.android.outputs.changed }}
      ios: ${{ steps.ios.outputs.changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # Shared by both: patched and installed packages, autolinking, app config.
      - name: Android
        id: android
        run: >-
          scripts/changed-files.sh
          '^(android/|modules/[^/]+/(android/|expo-module\.config\.json$)|patches/|package\.json$|pnpm-(lock|workspace)\.yaml$|app\.json$|\.node-version$|scripts/changed-files\.sh$|\.github/workflows/build\.yml$)'
          >> "$GITHUB_OUTPUT"

      - name: iOS
        id: ios
        run: >-
          scripts/changed-files.sh
          '^(ios/|modules/[^/]+/(ios/|expo-module\.config\.json$)|patches/|package\.json$|pnpm-(lock|workspace)\.yaml$|app\.json$|\.node-version$|Gemfile(\.lock)?$|\.ruby-version$|scripts/(test-ios\.sh|native-coverage\.mjs|check-patches\.sh|changed-files\.sh)$|\.github/workflows/build\.yml$)'
          >> "$GITHUB_OUTPUT"

  android:
    name: Android
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          # Not cached, as in check.yml: the ~200 MB store restores no faster
          # than a cold install and would crowd the Xcode caches out of the
          # repo's 10 GB.
          package-manager-cache: false

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ env.SAVE_CACHE != 'true' }}

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: android
          save: ${{ env.SAVE_CACHE }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # One ABI is enough to compile every native module and keeps the build
      # short. CMake (3.17+) picks up the compiler launchers from the environment.
      - name: Build debug APK
        working-directory: android
        run: ./gradlew app:assembleDebug -PreactNativeArchitectures=x86_64 --build-cache --no-daemon
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache

      - name: Show ccache stats
        if: always()
        run: ccache --show-stats || true

  apple:
    name: ${{ matrix.name }}
    # Never on PRs; Mac only when asked for by hand (see the matrix).
    needs: changes
    if: github.event_name != 'pull_request' && needs.changes.outputs.ios == 'true'
    runs-on: macos-26
    timeout-minutes: 120
    permissions:
      contents: read
      # To delete older compilation caches
      actions: write
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(inputs.mac && '["iOS","Mac"]' || '["iOS"]') }}
    env:
      # Only iOS keeps a compilation cache (see the top of this file).
      CACHE_CAS: ${{ matrix.name == 'iOS' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          # Not cached, as in check.yml: the ~200 MB store restores no faster
          # than a cold install and would crowd the Xcode caches out of the
          # repo's 10 GB.
          package-manager-cache: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          # Version comes from .ruby-version.
          bundler-cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Pods
        id: pods
        uses: actions/cache/restore@v6
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock', 'patches/**') }}
          restore-keys: pods-${{ runner.os }}-

      # Not --deployment: ExpoWidgets' podspec embeds the checkout's absolute
      # path, so its checksum in Podfile.lock differs on every machine.
      - name: Install pods
        working-directory: ios
        run: bundle exec pod install
        env:
          LANG: en_US.UTF-8

      # Both matrix jobs make the same Pods; whichever finishes second skips the save.
      - name: Save Pods
        if: env.SAVE_CACHE == 'true' && steps.pods.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ steps.pods.outputs.cache-primary-key }}

      # Xcode's own compilation cache (Swift and C-family). ccache doesn't work
      # here: Xcode 26 never calls the CC wrapper React Native sets up.
      - name: Restore compilation cache
        if: env.CACHE_CAS == 'true'
        uses: actions/cache/restore@v6
        with:
          path: build/DerivedData/CompilationCache.noindex
          key: xcode-cas-${{ matrix.name }}-${{ github.sha }}
          restore-keys: xcode-cas-${{ matrix.name }}-

      # iOS: the native tests (scripts/test-ios.sh) build the app and every
      # module, so they also prove it compiles. Signed to run locally (the
      # simulator default), which keeps the App Group entitlement the tests
      # need; no certificates involved.
      - name: Test
        if: matrix.name == 'iOS'
        run: |
          device="$(xcrun simctl list devices available --json |
            jq -r '[.devices | to_entries | sort_by(.key)[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))] | last | .udid')"
          echo "Simulator: $device"
          scripts/test-ios.sh "$device"
        env:
          DERIVED_DATA: build/DerivedData
          XCODEBUILD_ARGS: COMPILER_INDEX_STORE_ENABLE=NO COMPILATION_CACHE_ENABLE_CACHING=YES

      # Mac: no signing certificates on CI, so this only proves the code
      # compiles and links. Build signed when running the app.
      - name: Build
        if: matrix.name == 'Mac'
        run: |
          mkdir -p build
          xcodebuild build \
            -workspace ios/learnX.xcworkspace \
            -scheme learnX \
            -configuration Debug \
            -destination "generic/platform=macOS,variant=Mac Catalyst" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            > build/xcodebuild.log 2>&1 || {
            grep -E 'error:' build/xcodebuild.log | sort -u | head -50
            tail -n 80 build/xcodebuild.log
            exit 1
          }
          tail -n 5 build/xcodebuild.log

      - name: Save compilation cache
        if: always() && env.CACHE_CAS == 'true' && env.SAVE_CACHE == 'true'
        uses: actions/cache/save@v6
        with:
          path: build/DerivedData/CompilationCache.noindex
          key: xcode-cas-${{ matrix.name }}-${{ github.sha }}

      # The cache is ~5.5 GB and each main commit saves its own copy, so drop
      # the older ones before they evict Gradle and Pods from the 10 GB limit.
      - name: Delete older compilation caches
        if: always() && env.CACHE_CAS == 'true' && env.SAVE_CACHE == 'true'
        continue-on-error: true
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --key "xcode-cas-${{ matrix.name }}-" --limit 100 --json key --jq '.[].key' |
            grep -vx "xcode-cas-${{ matrix.name }}-$GITHUB_SHA" |
            while read -r key; do gh cache delete --repo "$GITHUB_REPOSITORY" "$key"; done
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xcodebuild-${{ matrix.name }}
          path: |
            build/xcodebuild.log
            build/DerivedData/results/*.xcresult
          if-no-files-found: ignore
