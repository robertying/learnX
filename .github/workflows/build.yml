name: Build

# Compiles debug builds so a broken patch, Podfile, Gradle or native module
# change shows up in CI, not on a Mac later. No JS bundle, no signing, no
# uploads. Not a required check.
#
# When each job runs:
# - Android (~6 min): PRs that touch native paths, main, and by hand.
# - iOS (~17 min warm): main when native paths changed, and by hand. Only iOS
#   keeps Xcode's compilation cache; a second Apple cache doesn't fit in the
#   repo's 10 GB cache limit.
# - Mac (~35 min, uncached): by hand only, with the "Build Mac" box ticked.
#
# Paused: only the manual trigger is on. To turn the rest on, uncomment the
# pull_request and push triggers below.
on:
  workflow_dispatch:
    inputs:
      mac:
        description: Build Mac
        type: boolean
        default: false
  # pull_request:
  #   paths: &native-paths
  #     - android/**
  #     - ios/**
  #     - modules/**
  #     - patches/**
  #     - package.json
  #     - pnpm-lock.yaml
  #     - pnpm-workspace.yaml
  #     - app.json
  #     - Gemfile
  #     - Gemfile.lock
  #     - .github/workflows/build.yml
  # push:
  #   branches: [main]
  #   paths: *native-paths

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# ccache keeps compiled C/C++/Objective-C between runs. Only main saves caches
# (Gradle, ccache, Pods, Xcode compilation cache), so other refs start from
# main's and can't evict or poison them.
env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_MAXSIZE: 2G
  CCACHE_COMPRESS: 'true'
  SAVE_CACHE: ${{ github.ref == 'refs/heads/main' }}

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ env.SAVE_CACHE != 'true' }}

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: android
          save: ${{ env.SAVE_CACHE }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # build.gradle reads release signing values from local.properties, so the
      # file has to exist. The debug build doesn't use them.
      - name: Write local.properties
        run: touch android/local.properties

      # One ABI is enough to compile every native module and keeps the build
      # short. CMake (3.17+) picks up the compiler launchers from the environment.
      - name: Build debug APK
        working-directory: android
        run: ./gradlew app:assembleDebug -PreactNativeArchitectures=x86_64 --build-cache --no-daemon
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache

      - name: Show ccache stats
        if: always()
        run: ccache --show-stats || true

  apple:
    name: ${{ matrix.name }}
    # iOS never runs on PRs; Mac only when asked for by hand.
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(inputs.mac && '["iOS","Mac"]' || '["iOS"]') }}
    env:
      DESTINATION: ${{ matrix.name == 'Mac' && 'generic/platform=macOS,variant=Mac Catalyst' || 'generic/platform=iOS Simulator' }}
      # Only iOS keeps a compilation cache (see the top of this file).
      CACHE_CAS: ${{ matrix.name == 'iOS' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby
          bundler-cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Pods
        id: pods
        uses: actions/cache/restore@v6
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock', 'patches/**') }}
          restore-keys: pods-${{ runner.os }}-

      # Not --deployment: ExpoWidgets' podspec embeds the checkout's absolute
      # path, so its checksum in Podfile.lock differs on every machine.
      - name: Install pods
        working-directory: ios
        run: bundle exec pod install
        env:
          LANG: en_US.UTF-8

      # Both matrix jobs make the same Pods; whichever finishes second skips the save.
      - name: Save Pods
        if: env.SAVE_CACHE == 'true' && steps.pods.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ steps.pods.outputs.cache-primary-key }}

      # Xcode's own compilation cache (Swift and C-family). ccache doesn't work
      # here: Xcode 26 never calls the CC wrapper React Native sets up.
      - name: Restore compilation cache
        if: env.CACHE_CAS == 'true'
        uses: actions/cache/restore@v6
        with:
          path: build/DerivedData/CompilationCache.noindex
          key: xcode-cas-${{ matrix.name }}-${{ github.sha }}
          restore-keys: xcode-cas-${{ matrix.name }}-

      # No signing certificates on CI, so this only proves the code compiles and
      # links. Build signed (as AGENTS.md says) when running the app.
      - name: Build
        run: |
          mkdir -p build
          xcodebuild build \
            -workspace ios/learnX.xcworkspace \
            -scheme learnX \
            -configuration Debug \
            -destination "$DESTINATION" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            COMPILATION_CACHE_ENABLE_CACHING=YES \
            > build/xcodebuild.log 2>&1 || {
            grep -E 'error:' build/xcodebuild.log | sort -u | head -50
            tail -n 80 build/xcodebuild.log
            exit 1
          }
          tail -n 5 build/xcodebuild.log
          du -sh build/DerivedData/CompilationCache.noindex || true

      - name: Save compilation cache
        if: always() && env.CACHE_CAS == 'true' && env.SAVE_CACHE == 'true'
        uses: actions/cache/save@v6
        with:
          path: build/DerivedData/CompilationCache.noindex
          key: xcode-cas-${{ matrix.name }}-${{ github.sha }}

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xcodebuild-${{ matrix.name }}
          path: build/xcodebuild.log
