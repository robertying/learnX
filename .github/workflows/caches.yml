name: Caches

# After each JS, Android, Apple or Electron run on main, which are the only
# runs that save caches, drops the caches newer ones replaced
# (scripts/ci/prune-caches.sh), so the repo stays under its 10 GB limit. A job
# of its own, so the jobs that build and run the project's code don't need
# write access to Actions.
on:
  workflow_run:
    workflows: [JS, Android, Apple, Electron]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: caches
  cancel-in-progress: false

jobs:
  prune:
    name: Cleanup
    if: github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/ci/prune-caches.sh
          sparse-checkout-cone-mode: false

      - name: Prune caches
        run: scripts/ci/prune-caches.sh
        env:
          GH_TOKEN: ${{ github.token }}
