name: Electron

# The Windows and Linux app (electron/). None of these checks is required: a
# break here never blocks a mobile change, as mobile releases never wait on
# the desktop app. Pull requests bundle the web build and run the Playwright
# E2E tests on Windows and Linux (ci.yml's JS checks run the `web` Jest
# project); main pushes and manual runs also package the installers on
# Windows and Linux from a web build of their own, without the E2E tests'
# made-up mock login (uploaded as workflow artifacts, never published; the
# update files are signed on the maintainer's Mac before a release, see the
# release skill).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: electron-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Electron web build (not required)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JS
        uses: ./.github/actions/setup-js

      # A made-up mock login, so the E2E tests can log in; the web build
      # inlines it as the mobile bundles do. For the E2E tests only: the
      # Package jobs export their own.
      - name: Export web build
        id: export
        run: |
          printf 'DUMMY_USERNAME=e2e\nDUMMY_PASSWORD=e2e\n' > .env
          pnpm exec expo export --platform web --output-dir build/electron/web
        env:
          CI: '1'

      - name: Upload web build
        if: ${{ !cancelled() && steps.export.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: electron-web
          path: build/electron/web
          retention-days: 1

  e2e:
    # The whole Playwright E2E suite (electron/e2e) in a dev run of the app
    # on the web build: the Maestro flows that apply to the desktop and what
    # only it does (files, submissions, notifications, the tray, the .ics
    # export, updates against updateServer.mjs, the SSO page). Linux runs it
    # under a virtual display. It needs the network, as the flows do: the
    # mock files download from GitHub and the SSO test opens
    # id.tsinghua.edu.cn.
    name: Electron E2E ${{ matrix.name }} (not required)
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JS
        uses: ./.github/actions/setup-js

      - name: Download web build
        uses: actions/download-artifact@v8
        with:
          name: electron-web
          path: build/electron/web

      # The same mock login as the web build's.
      - name: E2E tests
        shell: bash
        run: |
          printf 'DUMMY_USERNAME=e2e\nDUMMY_PASSWORD=e2e\n' > .env
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run --auto-servernum pnpm e2e:electron
          else
            pnpm e2e:electron
          fi

      # Traces and screenshots of failed tests, and the HTML report.
      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: electron-e2e-${{ matrix.name }}
          path: build/electron/e2e
          if-no-files-found: ignore

  package:
    # Each platform on its own runner, so Windows builds get their icon and
    # version info (which electron-builder can't write from Linux without
    # Wine). Both CPU architectures per platform.
    name: Electron package ${{ matrix.name }} (not required)
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            flag: --win
          - name: Linux
            os: ubuntu-latest
            flag: --linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JS
        uses: ./.github/actions/setup-js

      # Its own web build, never the E2E tests' (their made-up mock login
      # would let anyone in with it): the mock login from the repository's
      # DUMMY_USERNAME and DUMMY_PASSWORD secrets, as the mobile release
      # bundles have it from .env, checked as theirs is; without the secrets,
      # none.
      - name: Package
        shell: bash
        run: |
          rm -f .env
          if [ -n "$DUMMY_USERNAME" ] && [ -n "$DUMMY_PASSWORD" ]; then
            printf 'DUMMY_USERNAME=%s\nDUMMY_PASSWORD=%s\n' "$DUMMY_USERNAME" "$DUMMY_PASSWORD" > .env
          fi
          pnpm electron:package ${{ matrix.flag }}
          if [ -f .env ]; then
            node scripts/check-bundle-env.mjs build/electron/web/_expo/static/js/web/*.js
          fi
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          DUMMY_USERNAME: ${{ secrets.DUMMY_USERNAME }}
          DUMMY_PASSWORD: ${{ secrets.DUMMY_PASSWORD }}

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: electron-${{ matrix.name }}
          path: |
            build/electron/dist/*.exe
            build/electron/dist/*.blockmap
            build/electron/dist/*.AppImage
            build/electron/dist/*.deb
            build/electron/dist/latest*.yml
          if-no-files-found: error
          retention-days: 7
