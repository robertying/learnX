name: Check

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Only main saves the Jest cache, so other refs don't spend the repo's 10 GB
# cache limit, which the Xcode caches in build.yml need.
env:
  SAVE_CACHE: ${{ github.ref == 'refs/heads/main' }}
  JEST_CACHE_DIR: ${{ github.workspace }}/.jest-cache

jobs:
  js:
    # Typecheck, lint, format and Jest
    name: JS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Version comes from the `packageManager` field in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          # A cold `pnpm install` takes about 4 s, and restoring the ~200 MB
          # store cache took just as long, so it isn't cached.
          package-manager-cache: false

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      # The checks below run even if an earlier one fails, so one push shows
      # every failure. They're skipped only when setup failed.
      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint --deny-warnings

      - name: Format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm format --check

      # Jest's cache holds Babel output, mostly for node_modules. Its key
      # follows what changes that output; source files that changed since are
      # just transformed again.
      - name: Restore Jest cache
        id: jest-cache
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.JEST_CACHE_DIR }}
          key: jest-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'patches/**', 'babel.config.js', 'jest.config.js') }}

      - name: Test
        id: test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test --cacheDirectory "$JEST_CACHE_DIR"

      - name: Save Jest cache
        if: env.SAVE_CACHE == 'true' && steps.test.outcome == 'success' && steps.jest-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.JEST_CACHE_DIR }}
          key: ${{ steps.jest-cache.outputs.cache-primary-key }}

  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android: ${{ steps.android.outputs.changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # What the Android unit tests compile or run: the app's Gradle setup,
      # the local modules' Android code and autolinking, patched and installed
      # packages, and the scripts and workflow that run them.
      - name: Android
        id: android
        run: >-
          scripts/changed-files.sh
          '^(android/|modules/[^/]+/(android/|expo-module\.config\.json$)|patches/|package\.json$|pnpm-(lock|workspace)\.yaml$|app\.json$|\.node-version$|scripts/(test-android\.sh|android-coverage\.mjs|changed-files\.sh)$|\.github/workflows/check\.yml$)'
          >> "$GITHUB_OUTPUT"

  android-unit-tests:
    # The local modules' JVM unit tests (scripts/test-android.sh). A required
    # check: when nothing Android changed the job is skipped, which counts as
    # passing. It runs if Changes failed, so a broken filter can't skip it.
    name: Android unit tests
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.android != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ env.SAVE_CACHE != 'true' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The build cache lives in the Gradle home that setup-gradle restores,
      # so PRs reuse main's compiled outputs (dependency modules, Gradle
      # plugins) and only rebuild what changed.
      - name: Test
        run: scripts/test-android.sh --build-cache
