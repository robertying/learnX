name: Android

# Build (required): the local modules' JVM unit tests and a release APK. On a
# pull request that changes nothing Android it skips its steps and passes.
# Main pushes always build, which also refreshes the caches. E2E tests runs
# the Maestro flows on that APK, by hand only (Actions > Android > Run
# workflow, on main or a branch); a manual run builds the APKs it needs.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same pull request or to main cancels the older run: the
# newest run checks everything the older one would have (its commits too) and
# saves the caches. Manual runs each get their own group, so a push never
# cancels them and they never cancel a push run.
concurrency:
  group: android-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Only main saves caches (Gradle, ccache), so other refs start from main's and
# can't evict or poison them. caches.yml prunes superseded ones after each
# main run.
env:
  SAVE_CACHE: ${{ github.ref == 'refs/heads/main' }}
  # Manual runs: build the update APKs too and run E2E on them.
  E2E: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  build:
    # The local modules' JVM unit tests (scripts/checks/test-android.sh) and
    # a release APK (R8 and the bundled JS; -PciRelease signs it with the
    # debug key and turns off Crashlytics uploads, android/app/build.gradle).
    # A required check: on a pull request that changes nothing Android, every
    # step after the first is skipped and the job passes in seconds.
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      # Pull requests only: the app's Gradle setup, the modules' Android code
      # and autolinking, patched and installed packages, app config, and the
      # scripts and workflow that build them. The steps below run unless this
      # says nothing changed.
      - name: Detect changed files
        id: changes
        run: scripts/ci/changed-files.sh android >> "$GITHUB_OUTPUT"

      - name: Set up JS
        id: install
        if: steps.changes.outputs.changed == 'true'
        uses: ./.github/actions/setup-js

      - name: Set up Java
        if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17

      # The build cache lives in the Gradle home that setup-gradle restores,
      # so pull requests reuse main's compiled outputs (dependency modules,
      # Gradle plugins) and only rebuild what changed.
      - name: Set up Gradle
        id: gradle
        if: steps.changes.outputs.changed == 'true'
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ env.SAVE_CACHE != 'true' }}

      # Keeps compiled C/C++ between runs.
      - name: Set up ccache
        id: ccache
        if: steps.changes.outputs.changed == 'true'
        uses: hendrikmuhs/ccache-action@dbeefd73e8e2ffc1bbc412570072735eb4db3607 # v1.2.25
        with:
          key: android
          save: ${{ env.SAVE_CACHE }}

      # Robolectric downloads an Android jar for each SDK the tests run on
      # from Maven Central into ~/.m2, outside the Gradle home setup-gradle
      # caches, so every run fetched them again, and Maven Central has
      # answered with HTTP 429. The key is Robolectric's version and the SDKs
      # the tests ask for (robolectric.properties and @Config), so it changes
      # only when the set of jars does.
      - name: Robolectric cache key
        id: robolectric-key
        if: steps.changes.outputs.changed == 'true'
        run: |
          version=$(sed -n 's/.*robolectricVersion = "\(.*\)".*/\1/p' android/build.gradle)
          sdks=$(grep -rhoE '^sdk=[0-9]+|@Config\(sdk = \[[0-9, ]+\]' --include=robolectric.properties --include='*.kt' modules/*/android/src/test android/app/src/test android/patch-tests/src/test |
            grep -oE '[0-9]+' | sort -un | paste -sd- -)
          echo "key=robolectric-$version-sdk-$sdks" >> "$GITHUB_OUTPUT"

      - name: Restore Robolectric jars
        id: robolectric-cache
        if: steps.changes.outputs.changed == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: ${{ steps.robolectric-key.outputs.key }}

      - name: Unit tests
        id: unit-tests
        if: steps.changes.outputs.changed == 'true'
        run: scripts/checks/test-android.sh --build-cache

      - name: Save Robolectric jars
        if: env.SAVE_CACHE == 'true' && steps.unit-tests.outcome == 'success' && steps.robolectric-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: ${{ steps.robolectric-key.outputs.key }}

      # The release bundle inlines .env; the mock login is what E2E logs in
      # with. Any non-empty values work, as they only switch to mock data.
      # One ABI is enough to compile every native module and keeps the build
      # short. CMake (3.17+) picks up the compiler launchers from the
      # environment. Runs even if the unit tests failed, so one push shows
      # both, and reuses their Gradle daemon.
      - name: Build release APK
        id: apk
        if: >-
          !cancelled() && steps.changes.outputs.changed == 'true' &&
          steps.install.outcome == 'success' && steps.gradle.outcome == 'success' &&
          steps.ccache.outcome == 'success'
        run: |
          bash scripts/ci/write-e2e-env.sh
          # The key E2E builds trust for over-the-air updates.
          scripts/e2e/ota-e2e-cert.sh
          cd android
          ./gradlew app:assembleGithubRelease -PciRelease -PreactNativeArchitectures=x86_64 --build-cache
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          # An E2E build, as scripts/e2e/e2e-build.sh makes (babel/inline-env.js).
          TEST_LOGIN: '1'

      # The APK, and newer builds of the same app for the updater flows to
      # update to (scripts/e2e/e2e-updater.sh), which differ only in the version
      # and are built over it.
      - name: Build update APKs for E2E
        if: >-
          !cancelled() && env.E2E == 'true' && steps.apk.outcome == 'success'
        run: |
          apk=app/build/outputs/apk/github/release/app-github-x86_64-release.apk
          mkdir -p ../build/e2e-apks/updater
          cp "$apk" ../build/e2e-apks/
          for version in 99.0.0 99.0.1; do
            ./gradlew app:assembleGithubRelease -PciRelease -PreactNativeArchitectures=x86_64 -Pe2eVersion="$version" --build-cache
            cp "$apk" "../build/e2e-apks/updater/learnX-$version.apk"
          done
        working-directory: android
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          TEST_LOGIN: '1'

      - name: Show ccache stats
        if: ${{ !cancelled() && steps.ccache.outcome == 'success' }}
        run: ccache --show-stats || true

      - name: Upload APK for E2E
        if: env.E2E == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apk
          path: build/e2e-apks
          retention-days: 1

      # The update server in the E2E job signs with the key this APK trusts.
      - name: Upload update signing key for E2E
        if: env.E2E == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-ota-e2e-key
          path: build/ota-e2e/*.pem
          retention-days: 1

  e2e:
    # The Maestro flows (scripts/e2e/e2e.sh) in an emulator on the APK from
    # Build, in manual runs only. The first flow logs in through the real SSO
    # login, so it needs id.tsinghua.edu.cn reachable from the runner. The flows are kept passing here, as on the local devices
    # (.maestro/AGENTS.md). No iOS E2E in CI. The emulator runs in Chinese
    # (its system language: a per-app language doesn't survive the flows'
    # clearState); the local devices cover English.
    name: E2E tests
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MAESTRO_VERSION: 2.12.1
      MAESTRO_CLI_NO_ANALYTICS: 'true'
      MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-apk
          path: build

      - name: Download update signing key
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-ota-e2e-key
          path: build/ota-e2e

      # scripts/e2e/e2e.sh reads the flows' labels and mock texts from the
      # translations and mock data (scripts/e2e/e2e-env.mjs), which import packages.
      - name: Set up JS
        uses: ./.github/actions/setup-js

      # scripts/e2e/e2e.sh types the mock login from .env; same values as the build.
      - name: Write .env
        run: bash scripts/ci/write-e2e-env.sh

      - name: Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run flows
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: '37.0'
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          # The action's default options. The system language is set after
          # boot by scripts/e2e/android-locale.sh, which doesn't restart Android:
          # the emulator's -change-locale does, and the emulator sometimes
          # exited or dropped its adb connection during that restart.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            scripts/e2e/android-locale.sh zh-CN
            adb install -r build/app-github-x86_64-release.apk
            mkdir -p build/maestro; E2E_SCREENSHOTS=build/maestro/screenshots scripts/e2e/e2e.sh android --format junit --output build/maestro/report.xml --test-output-dir build/maestro; status=$?; scripts/e2e/e2e-ota.sh android || status=1; scripts/e2e/e2e-updater.sh android build/updater || status=1; cp build/ota-e2e/server-android.log build/updater-e2e/server.log build/maestro/ 2>/dev/null || true; adb logcat -d > build/maestro/logcat.txt; scripts/e2e/android-crash-reports.sh build/maestro; exit $status

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-e2e
          path: build/maestro
          if-no-files-found: ignore
          retention-days: 14
