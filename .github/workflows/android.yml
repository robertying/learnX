name: Android

# Build (required): the local modules' JVM unit tests and a release APK. On a
# pull request that changes nothing Android it skips its steps and passes.
# Main pushes always build, which also refreshes the caches. E2E tests runs
# the Maestro flows on that APK, by hand only (Actions > Android > Run
# workflow, on main or a branch); a manual run builds the APKs it needs.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A new push to a PR cancels that PR's older run. Main pushes and manual runs
# each get their own group, so another merge can't cancel them (and the caches
# they save).
concurrency:
  group: android-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

# Only main saves caches (Gradle, ccache), so other refs start from main's and
# can't evict or poison them. caches.yml prunes superseded ones after each
# main run.
env:
  SAVE_CACHE: ${{ github.ref == 'refs/heads/main' }}
  # Manual runs: build the update APKs too and run E2E on them.
  E2E: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  build:
    # The local modules' JVM unit tests (scripts/test-android.sh) and a release
    # APK (R8 and the bundled JS; -PciRelease signs it with the debug key and
    # turns off Crashlytics uploads, android/app/build.gradle). A required
    # check: on a pull request that changes nothing Android, every step after
    # the first is skipped and the job passes in seconds.
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # Pull requests only: the app's Gradle setup, the modules' Android code
      # and autolinking, patched and installed packages, app config, and the
      # scripts and workflow that build them. The steps below run unless this
      # says nothing changed.
      - name: Detect changed files
        id: changes
        run: scripts/changed-files.sh android >> "$GITHUB_OUTPUT"

      - name: Set up JS
        id: install
        if: steps.changes.outputs.changed != 'false'
        uses: ./.github/actions/setup-js

      - name: Set up Java
        if: steps.changes.outputs.changed != 'false'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # The build cache lives in the Gradle home that setup-gradle restores,
      # so pull requests reuse main's compiled outputs (dependency modules,
      # Gradle plugins) and only rebuild what changed.
      - name: Set up Gradle
        id: gradle
        if: steps.changes.outputs.changed != 'false'
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ env.SAVE_CACHE != 'true' }}

      # Keeps compiled C/C++ between runs.
      - name: Set up ccache
        id: ccache
        if: steps.changes.outputs.changed != 'false'
        uses: hendrikmuhs/ccache-action@dbeefd73e8e2ffc1bbc412570072735eb4db3607 # v1.2.25
        with:
          key: android
          save: ${{ env.SAVE_CACHE }}

      - name: Unit tests
        if: steps.changes.outputs.changed != 'false'
        run: scripts/test-android.sh --build-cache

      # The release bundle inlines .env; the mock login is what E2E logs in
      # with. Any non-empty values work, as they only switch to mock data.
      # One ABI is enough to compile every native module and keeps the build
      # short. CMake (3.17+) picks up the compiler launchers from the
      # environment. Runs even if the unit tests failed, so one push shows
      # both, and reuses their Gradle daemon.
      - name: Build release APK
        if: >-
          !cancelled() && steps.changes.outputs.changed != 'false' &&
          steps.install.outcome == 'success' && steps.gradle.outcome == 'success' &&
          steps.ccache.outcome == 'success'
        run: |
          bash scripts/write-e2e-env.sh
          # The key E2E builds trust for over-the-air updates.
          scripts/ota-e2e-cert.sh
          cd android
          ./gradlew app:assembleGithubRelease -PciRelease -PreactNativeArchitectures=x86_64 --build-cache
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          # An E2E build, as scripts/e2e-build.sh makes (babel/inline-env.js).
          TEST_LOGIN: '1'

      # The APK, and newer builds of the same app for the updater flows to
      # update to (scripts/e2e-updater.sh), which differ only in the version
      # and are built over it.
      - name: Build update APKs for E2E
        if: >-
          !cancelled() && env.E2E == 'true'
        run: |
          apk=app/build/outputs/apk/github/release/app-github-x86_64-release.apk
          mkdir -p ../build/e2e-apks/updater
          cp "$apk" ../build/e2e-apks/
          for version in 99.0.0 99.0.1; do
            ./gradlew app:assembleGithubRelease -PciRelease -PreactNativeArchitectures=x86_64 -Pe2eVersion="$version" --build-cache
            cp "$apk" "../build/e2e-apks/updater/learnX-$version.apk"
          done
        working-directory: android
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          TEST_LOGIN: '1'

      - name: Show ccache stats
        if: ${{ !cancelled() && steps.ccache.outcome == 'success' }}
        run: ccache --show-stats || true

      - name: Upload APK for E2E
        if: env.E2E == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: apk
          path: build/e2e-apks
          retention-days: 1

      # The update server in the E2E job signs with the key this APK trusts.
      - name: Upload update signing key for E2E
        if: env.E2E == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ota-e2e-key
          path: build/ota-e2e/*.pem
          retention-days: 1

  e2e:
    # The Maestro flows (scripts/e2e.sh) in an emulator on the APK from
    # Build, in manual runs only. The first flow logs in
    # through the real SSO login, so it needs id.tsinghua.edu.cn reachable from
    # the runner. The flows are kept passing here, as on the local devices
    # (.maestro/AGENTS.md). No iOS E2E in CI. The emulator runs in Chinese
    # (its system language: a per-app language doesn't survive the flows'
    # clearState); the local devices cover English.
    name: E2E tests
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MAESTRO_VERSION: 2.12.1
      MAESTRO_CLI_NO_ANALYTICS: 'true'
      MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download APK
        uses: actions/download-artifact@v8
        with:
          name: apk
          path: build

      - name: Download update signing key
        uses: actions/download-artifact@v8
        with:
          name: ota-e2e-key
          path: build/ota-e2e

      # scripts/e2e.sh reads the flows' labels and mock texts from the
      # translations and mock data (scripts/e2e-env.mjs), which import packages.
      - name: Set up JS
        uses: ./.github/actions/setup-js

      # scripts/e2e.sh types the mock login from .env; same values as the build.
      - name: Write .env
        run: bash scripts/write-e2e-env.sh

      - name: Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run flows
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: '37.0'
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          # The action's default options. The system language is set after
          # boot by scripts/android-locale.sh, which doesn't restart Android:
          # the emulator's -change-locale does, and the emulator sometimes
          # exited or dropped its adb connection during that restart.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            scripts/android-locale.sh zh-CN
            adb install -r build/app-github-x86_64-release.apk
            mkdir -p build/maestro; E2E_SCREENSHOTS=build/maestro/screenshots scripts/e2e.sh android --format junit --output build/maestro/report.xml --test-output-dir build/maestro; status=$?; scripts/e2e-ota.sh android || status=1; scripts/e2e-updater.sh android build/updater || status=1; cp build/ota-e2e/server-android.log build/updater-e2e/server.log build/maestro/ 2>/dev/null || true; adb logcat -d > build/maestro/logcat.txt; scripts/android-crash-reports.sh build/maestro; exit $status

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-android
          path: build/maestro
          if-no-files-found: ignore
          retention-days: 14
