name: Bug Report
description: 问题反馈与帮助
title: '[Bug] 在此填写简短的问题描述作为标题……'
labels: [bug]

body:
  - type: textarea
    id: problem-description
    attributes:
      label: 问题描述
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: 复现过程
      value: |
        1.
        2.
        3.
        ...
    validations:
      required: true

  - type: textarea
    id: attempted-solutions
    attributes:
      label: 已尝试的解决方案
      value: |
        1.
        2.
        3.
        ...
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: 截图

  - type: input
    id: app-version
    attributes:
      label: App 版本
      description: '设置 › 关于 › 版本'
      placeholder: 'X.Y.Z (构建号)'
    validations:
      required: true

  - type: input
    id: device-model
    attributes:
      label: 设备型号
      placeholder: '例如：iPhone 17 Pro，iPad Air，MacBook Air，小米 15'
    validations:
      required: true

  - type: input
    id: system-version
    attributes:
      label: 系统版本
      placeholder: '例如：iOS 27.1，macOS 27.1，Android 16'
    validations:
      required: true

  - type: textarea
    id: additional-information
    attributes:
      label: 补充内容
