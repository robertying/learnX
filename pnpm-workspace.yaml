# The app, and the Electron app around its web build (electron/).
packages:
  - .
  - electron
allowBuilds:
  '@parcel/watcher': true
  msgpackr-extract: true
  # Its install script downloads Electron itself (about 100 MB), which only
  # the Electron app needs: electron/dev.ts downloads it on first run.
  electron: false
  # Squirrel.Windows' installer tools, which electron-builder brings for a
  # target learnX doesn't build (it builds NSIS).
  electron-winstaller: false
nodeLinker: hoisted
# Install fails on a Node older than package.json's `engines`.
engineStrict: true
# pnpm's default minimumReleaseAge (1 day) applies to everything else.
minimumReleaseAgeExclude:
  - '@robertying/thu-learn-lib'

# Applied by pnpm on every install; the lockfile records each patch's hash, so
# a changed patch reinstalls its package. Make or edit one with `pnpm patch <pkg>`
# then `pnpm patch-commit <dir>` (see patches/README.md).
patchedDependencies:
  'react-native@0.88.1': patches/react-native@0.88.1.patch
  'react-native-bottom-tabs@1.5.0': patches/react-native-bottom-tabs@1.5.0.patch
  'react-native-pdf@7.0.5': patches/react-native-pdf@7.0.5.patch
  'react-native-reanimated@4.7.1': patches/react-native-reanimated@4.7.1.patch
  'react-native-screens@4.30.1': patches/react-native-screens@4.30.1.patch
  'react-native-tab-view@4.3.5': patches/react-native-tab-view@4.3.5.patch
  'react-native-webview@14.0.1': patches/react-native-webview@14.0.1.patch
  'whatwg-fetch@3.6.20': patches/whatwg-fetch@3.6.20.patch
  '@expo/ui@58.0.28': patches/@expo__ui@58.0.28.patch
  'expo-calendar@58.0.7': patches/expo-calendar@58.0.7.patch
  'expo-document-picker@58.0.5': patches/expo-document-picker@58.0.5.patch
  'expo-widgets@58.0.28': patches/expo-widgets@58.0.28.patch
  'react-native-pager-view@10.0.3': patches/react-native-pager-view@10.0.3.patch
  'expo-background-task@58.0.13': patches/expo-background-task@58.0.13.patch
  '@react-navigation/native-stack@7.21.1': patches/@react-navigation__native-stack@7.21.1.patch

# Agent skills that packages ship. Agents here work from the repo's own
# AGENTS.md files and .claude/skills, so none are taken from dependencies.
permissions:
  expo-sqlite:
    skills: false
