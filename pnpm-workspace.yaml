allowBuilds:
  '@parcel/watcher': true
  msgpackr-extract: true
nodeLinker: hoisted
# Install fails on a Node older than package.json's `engines`.
engineStrict: true
# pnpm's default minimumReleaseAge (1 day) applies to everything else.
minimumReleaseAgeExclude:
  - '@robertying/thu-learn-lib'

# Applied by pnpm on every install; the lockfile records each patch's hash, so
# a changed patch reinstalls its package. Make or edit one with `pnpm patch <pkg>`
# then `pnpm patch-commit <dir>` (see patches/README.md).
patchedDependencies:
  '@react-navigation/native-stack@7.21.0': patches/@react-navigation__native-stack@7.21.0.patch
  'expo-calendar@58.0.6': patches/expo-calendar@58.0.6.patch
  'expo-document-picker@58.0.4': patches/expo-document-picker@58.0.4.patch
  'expo-widgets@58.0.27': patches/expo-widgets@58.0.27.patch
  'react-native@0.88.1': patches/react-native@0.88.1.patch
  'react-native-bottom-tabs@1.5.0': patches/react-native-bottom-tabs@1.5.0.patch
  'react-native-pager-view@10.0.0': patches/react-native-pager-view@10.0.0.patch
  'react-native-pdf@7.0.5': patches/react-native-pdf@7.0.5.patch
  'react-native-reanimated@4.7.1': patches/react-native-reanimated@4.7.1.patch
  'react-native-screens@4.30.1': patches/react-native-screens@4.30.1.patch
  'react-native-tab-view@4.3.4': patches/react-native-tab-view@4.3.4.patch
  'react-native-webview@14.0.1': patches/react-native-webview@14.0.1.patch
  'whatwg-fetch@3.6.20': patches/whatwg-fetch@3.6.20.patch
