plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'io.robertying.learnx'
version = '1.0.0'

android {
  namespace "io.robertying.learnx.crashlytics"

  buildTypes {
    debug {
      // createDebugUnitTestCoverageReport writes JaCoCo's report for the unit tests.
      enableUnitTestCoverage true
    }
  }

  testOptions {
    unitTests.includeAndroidResources = true
  }
}

dependencies {
  // The app's BoM (android/build.gradle), so this resolves to the Crashlytics it already links.
  implementation platform("com.google.firebase:firebase-bom:${rootProject.ext.firebaseBomVersion}")
  implementation("com.google.firebase:firebase-crashlytics")

  testImplementation("junit:junit:${rootProject.ext.junitVersion}")
  testImplementation("org.robolectric:robolectric:${rootProject.ext.robolectricVersion}")
  testImplementation("io.mockk:mockk:${rootProject.ext.mockkVersion}")
}

// Robolectric runs Android 15 and later only on Java 21, and Android 16 reaches
// into the JDK's file descriptor internals.
tasks.withType(Test).configureEach { test ->
  javaLauncher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(21)
  }
  jvmArgs "--add-exports=java.base/jdk.internal.access=ALL-UNNAMED", "--add-opens=java.base/java.io=ALL-UNNAMED"
  testLogging {
    exceptionFormat = "full"
  }
  // JaCoCo also counts the classes Robolectric's sandbox loads.
  test.extensions.configure(JacocoTaskExtension) {
    it.includeNoLocationClasses = true
    it.excludes = ["jdk.internal.*"]
  }
}
