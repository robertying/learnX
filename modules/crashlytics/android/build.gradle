plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'io.robertying.learnx'
version = '1.0.0'

android {
  namespace "io.robertying.learnx.crashlytics"
}

dependencies {
  // Same BoM as the app, so this resolves to the Crashlytics it already links.
  implementation platform("com.google.firebase:firebase-bom:35.1.0")
  implementation("com.google.firebase:firebase-crashlytics")
}
